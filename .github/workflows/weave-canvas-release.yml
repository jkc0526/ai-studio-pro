name: WeaveCanvas Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: WeaveCanvas release tag (v0.7.x)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: startsWith(inputs.tag, 'v0.7.')
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v0\.7\.\d+$') {
            throw "Only WeaveCanvas v0.7.x tags are accepted."
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($package.version)" -ne $env:RELEASE_TAG) {
            throw "Tag does not match package.json version."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer and updater metadata to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "WeaveCanvas Setup $version.exe"
          $assetPaths = @(
            (Join-Path 'release/installers' $installer),
            (Join-Path 'release/installers' "$installer.blockmap"),
            (Join-Path 'release/installers' 'latest.yml')
          )
          foreach ($assetPath in $assetPaths) {
            if (-not (Test-Path -LiteralPath $assetPath)) {
              throw "Required update asset was not produced: $assetPath"
            }
          }
          & gh release upload $env:RELEASE_TAG @assetPaths --clobber --repo jkc0526/ai-studio-pro
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to upload installer and updater metadata to GitHub Release.'
          }
