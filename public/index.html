<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro — AI 图片/视频生成</title>
<style>
:root{
  --bg:#0a0a0f; --surface:#13131e; --surface2:#1a1a2e; --border:#252538;
  --text:#e0e0e8; --muted:#8888a0; --accent:#6366f1; --accent2:#8b5cf6;
  --success:#10b981; --error:#ef4444; --warn:#f59e0b;
  --radius:12px; --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a3a55}
textarea,input,select,button{font-family:inherit}
textarea{resize:vertical}

/* Top Bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.topbar-right{display:flex;align-items:center;gap:10px}
.apikey-bar{display:flex;align-items:center;gap:8px}
.apikey-bar input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:13px;width:240px;outline:none;transition:border-color .2s}
.apikey-bar input:focus{border-color:var(--accent)}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;color:var(--text);cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:#fff}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.btn-accent:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Model Selector */
.model-selector{display:flex;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.model-card{min-width:200px;flex:1;max-width:280px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:10px;position:relative}
.model-card:hover{border-color:#3a3a55;transform:translateY(-1px)}
.model-card.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.08))}
.model-icon{width:36px;height:36px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.model-info{flex:1;min-width:0}
.model-info h3{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-info p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-tag{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0;text-transform:uppercase}
.tag-free{background:rgba(16,185,129,.15);color:var(--success)}
.tag-paid{background:rgba(245,158,11,.15);color:var(--warn)}
.tag-custom{background:rgba(139,92,246,.15);color:var(--accent2)}
.model-card .btn-edit{position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(0,0,0,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;opacity:0;transition:opacity .2s;color:#fff;border:none}
.model-card:hover .btn-edit{opacity:1}
.model-card .btn-edit:hover{background:rgba(0,0,0,.7)}
.model-add-card{min-width:200px;flex:0 0 180px;background:transparent;border:2px dashed var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.model-add-card:hover{border-color:var(--accent);color:var(--accent)}

/* Main Layout */
.main{display:flex;min-height:calc(100vh - 130px)}
.panel-left{width:460px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:20px}
.panel-right{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;padding:20px}

/* Control Sections */
.section{margin-bottom:22px}
.section-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.textarea,input[type=text],input[type=password],input[type=number],select{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .2s}
.textarea{min-height:90px}
.textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.negative-wrap{margin-top:8px}
.negative-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.negative-toggle:hover{color:var(--text)}
.negative-body{margin-top:8px;display:none}
.negative-body.open{display:block}
.mode-tabs{display:flex;gap:6px;margin-bottom:10px}
.mode-tab{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted);transition:all .2s}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.seed-row{display:flex;gap:8px;align-items:center}
.seed-row input{flex:1}
.btn-lock{flex:0 0 auto;width:38px;height:38px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;color:var(--muted);transition:all .2s}
.btn-lock.locked{color:var(--warn);border-color:var(--warn)}

/* Upload Area */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted)}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:rgba(99,102,241,.05);color:var(--text)}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-hint{font-size:12px}
.upload-area input[type=file]{display:none}
.upload-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.upload-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;position:relative}
.upload-card img,.upload-card audio{width:100%;border-radius:6px;display:block;max-height:100px;object-fit:cover}
.upload-card .card-name{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text);font-size:11px;width:100%;margin-top:6px;outline:none}
.upload-card .card-name:focus{border-color:var(--accent)}
.upload-card .card-mention{font-size:10px;color:var(--accent);margin-top:4px;text-align:center}
.upload-card .btn-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.6);border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.upload-card .btn-remove:hover{background:var(--error)}

/* Reference Mapping */
.ref-table{margin-top:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-size:12px;display:none}
.ref-table.open{display:block}
.ref-table h4{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.ref-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border)}
.ref-row:last-child{border:none}
.ref-row .ref-src{color:var(--accent)}
.ref-row .ref-dst{color:var(--success)}

/* @ Mention Dropdown */
.mention-dropdown{position:absolute;background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:200px;overflow-y:auto;z-index:50;display:none;min-width:200px}
.mention-dropdown.open{display:block}
.mention-item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.mention-item:hover,.mention-item.active{background:rgba(99,102,241,.15)}
.mention-item .mi-icon{font-size:14px}
.prompt-wrap{position:relative}

/* Generate */
.gen-btn{width:100%;padding:14px;font-size:15px;font-weight:600;margin-top:6px}
.progress-wrap{margin-top:12px;display:none}
.progress-wrap.open{display:block}
.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s}
.progress-text{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}

/* Result Area */
.result-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px}
.result-placeholder{text-align:center;color:var(--muted)}
.result-placeholder .ph-icon{font-size:64px;margin-bottom:12px;opacity:.3}
.result-placeholder p{font-size:14px}
.result-content{max-width:100%;text-align:center}
.result-content img,.result-content video{max-width:100%;max-height:70vh;border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.result-meta{margin-top:16px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;width:100%;max-width:600px}
.result-meta .meta-row{display:flex;gap:8px;font-size:12px;margin-bottom:4px}
.result-meta .meta-label{color:var(--muted);min-width:60px}
.result-meta .meta-val{color:var(--text);word-break:break-all}
.result-actions{margin-top:12px;display:flex;gap:10px;justify-content:center}

/* History */
.history-section{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history-header h3{font-size:14px;font-weight:600}
.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.history-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.history-item img,.history-item video{width:100%;height:100px;object-fit:cover;display:block}
.history-item .h-type{position:absolute;top:4px;left:4px;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;text-transform:uppercase}
.history-item .h-type-img{background:rgba(99,102,241,.8);color:#fff}
.history-item .h-type-vid{background:rgba(139,92,246,.8);color:#fff}
.history-empty{text-align:center;color:var(--muted);padding:30px;font-size:13px}

/* Toast */
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:toastIn .3s ease}
.toast-success{border-color:var(--success);color:var(--success)}
.toast-error{border-color:var(--error);color:var(--error)}
.toast-warn{border-color:var(--warn);color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Update Banner */
.update-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:10px 24px;display:none;align-items:center;justify-content:space-between;z-index:150;font-size:13px;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.update-banner.open{display:flex;animation:slideDown .3s ease}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.update-banner .ub-left{display:flex;align-items:center;gap:10px}
.update-banner .ub-right{display:flex;align-items:center;gap:8px}
.update-banner .btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff}
.update-banner .btn:hover{background:rgba(255,255,255,.3)}
.update-progress-bar{width:200px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-top:4px}
.update-progress-fill{height:100%;background:#fff;transition:width .3s;border-radius:3px}
.version-badge{font-size:11px;color:var(--muted);padding:3px 8px;background:var(--surface2);border-radius:10px;cursor:pointer;transition:all .2s}
.version-badge:hover{color:var(--accent);border-color:var(--accent)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:560px;max-width:90vw;max-height:85vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:18px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.modal-field input,.modal-field select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;width:100%;outline:none}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent)}
.modal-row{display:flex;gap:12px}
.modal-row>*{flex:1}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.checkbox-item input{width:auto}
.modal-list{margin-bottom:14px}
.modal-list h4{font-size:12px;color:var(--muted);margin-bottom:8px}
.modal-list-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:6px;font-size:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo"><div class="logo-mark">AI</div><span>AI Studio Pro</span><span class="version-badge" id="versionBadge" onclick="checkForUpdates()" title="点击检查更新">v?</span></div>
  <div class="topbar-right">
    <div class="apikey-bar">
      <input type="password" id="apiKey" placeholder="输入 API Key..." />
      <button class="btn btn-accent" onclick="saveApiKey()">保存</button>
    </div>
    <button class="btn" onclick="openModelModal()">自定义模型</button>
  </div>
</div>

<!-- Update Banner -->
<div class="update-banner" id="updateBanner">
  <div class="ub-left">
    <span>🚀</span>
    <span id="updateBannerText">发现新版本！</span>
  </div>
  <div class="ub-right" id="updateBannerRight">
    <button class="btn" onclick="downloadUpdate()">立即更新</button>
    <button class="btn" onclick="closeUpdateBanner()">稍后</button>
  </div>
</div>

<!-- Model Selector -->
<div class="model-selector" id="modelSelector"></div>

<!-- Main -->
<div class="main">
  <!-- Left Panel -->
  <div class="panel-left" id="controlPanel"></div>
  <!-- Right Panel -->
  <div class="panel-right">
    <div class="result-area" id="resultArea">
      <div class="result-placeholder">
        <div class="ph-icon">🎨</div>
        <p>选择模型并输入 Prompt 开始生成</p>
      </div>
    </div>
    <div class="history-section">
      <div class="history-header">
        <h3>历史记录</h3>
        <button class="btn" onclick="clearHistory()">清空</button>
      </div>
      <div class="history-grid" id="historyGrid">
        <div class="history-empty">暂无历史记录</div>
      </div>
    </div>
  </div>
</div>

<!-- Mention Dropdown -->
<div class="mention-dropdown" id="mentionDropdown"></div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Custom Model Modal -->
<div class="modal-overlay" id="modelModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">自定义模型</h2>
      <button class="modal-close" onclick="closeModelModal()">&times;</button>
    </div>
    <input type="hidden" id="cmId" />
    <div class="modal-row">
      <div class="modal-field"><label>名称</label><input type="text" id="cmName" placeholder="My Custom Model" /></div>
      <div class="modal-field"><label>图标 (emoji)</label><input type="text" id="cmIcon" placeholder="🤖" maxlength="4" /></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>模型 ID</label><input type="text" id="cmModelId" placeholder="agnes-custom-1.0" /></div>
      <div class="modal-field"><label>类型</label><select id="cmType"><option value="image">图片</option><option value="video">视频</option></select></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>标签</label><select id="cmTag"><option value="free">Free</option><option value="paid">Paid</option></select></div>
      <div class="modal-field"><label>API Base (可选)</label><input type="text" id="cmApiBase" placeholder="/api" /></div>
    </div>
    <div class="modal-field" id="cmImageFields">
      <label>尺寸</label><input type="text" id="cmSizes" placeholder="1K,2K,4K" value="1K,2K,4K" />
      <label style="margin-top:8px">比例</label><input type="text" id="cmRatios" placeholder="1:1,16:9,9:16" value="1:1,16:9,9:16,4:3,3:4" />
    </div>
    <div id="cmVideoFields" style="display:none">
      <div class="modal-field"><label>模式</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" value="text" class="cmMode" checked /> Text</label>
          <label class="checkbox-item"><input type="checkbox" value="reference" class="cmMode" checked /> Reference</label>
          <label class="checkbox-item"><input type="checkbox" value="keyframe" class="cmMode" checked /> Keyframe</label>
        </div>
      </div>
      <div class="modal-row">
        <div class="modal-field"><label>最大图片数</label><input type="number" id="cmMaxImages" value="5" /></div>
        <div class="modal-field"><label>时长 (秒)</label><input type="text" id="cmDurations" placeholder="4,5,6,7,8" value="4,5,6,7,8,9,10,11,12" /></div>
      </div>
      <div class="modal-row">
        <div class="modal-field"><label>尺寸</label><input type="text" id="cmVSizes" placeholder="720P,960P,2K" value="720P,960P,2K" /></div>
        <div class="modal-field"><label>比例</label><input type="text" id="cmVRatios" placeholder="16:9,9:16" value="16:9,9:16,4:3,1:1" /></div>
      </div>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="cmAudio" checked /> 支持音频参考</label>
        <label class="checkbox-item"><input type="checkbox" id="cmVideoRef" /> 支持视频参考</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModelModal()">取消</button>
      <button class="btn btn-accent" onclick="saveCustomModel()">保存模型</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:20px 0" />
    <div class="modal-list">
      <h4>已有自定义模型</h4>
      <div id="customModelList"></div>
    </div>
  </div>
</div>

<script>
/* ==================== State ==================== */
let currentModel = null;
let uploadedImages = []; // [{dataUri, label, name}]
let uploadedAudios = []; // [{dataUri, label, name}]
let history = [];
let customModels = [];
let lastSeed = null;
let lockedSeed = null;
let isGenerating = false;

/* ==================== Preset Models ==================== */
const PRESET_MODELS = [
  {id:'img-flash', name:'Image 2.5 Flash', modelId:'agnes-image-2.5-flash', type:'image', tag:'free', icon:'🖼', desc:'1K-4K 图片生成', sizes:['1K','2K','4K'], ratios:['1:1','16:9','9:16','4:3','3:4']},
  {id:'vid-flash', name:'Video 2.5 Flash', modelId:'agnes-video-2.5-flash', type:'video', tag:'free', icon:'🎬', desc:'720P 视频', sizes:['720P'], ratios:['16:9','9:16','4:3','1:1'], modes:['text','reference','keyframe'], maxImages:5, durations:[4,5,6,7,8,9,10,11,12], supportsAudio:true},
  {id:'vid-full', name:'Video 2.5', modelId:'agnes-video-2.5', type:'video', tag:'paid', icon:'🎥', desc:'720P-2K 视频', sizes:['720P','960P','2K'], ratios:['16:9','9:16','4:3','1:1'], modes:['text','reference','keyframe'], maxImages:5, durations:[4,5,6,7,8,9,10,11,12], supportsAudio:true, supportsVideoRef:true}
];

/* ==================== Templates ==================== */
const TEMPLATES = [

/* ==================== Helpers ==================== */
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getApiKey(){ return localStorage.getItem('agnes_api_key')||''; }
function saveApiKey(){
  const k=document.getElementById('apiKey').value.trim();
  if(!k){ showToast('请输入 API Key','error'); return; }
  localStorage.setItem('agnes_api_key',k);
  showToast('API Key 已保存','success');
}
function getAllModels(){ return [...PRESET_MODELS,...customModels]; }
function getNegPrompt(id){
  const el=document.getElementById(id);
  if(!el) return '';
  const wrap=el.closest('.negative-body');
  if(wrap&&!wrap.classList.contains('open')) return '';
  return el.value.trim();
}
function getSeedValue(){
  if(lockedSeed!==null) return lockedSeed;
  const s=val('seedInput');
  return s||null;
}
function showToast(msg,type){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(20px)'; setTimeout(()=>t.remove(),300); },3000);
}
function setGenerating(b){
  isGenerating=b;
  document.querySelectorAll('.gen-btn').forEach(btn=>btn.disabled=b);
  const pw=document.querySelector('.progress-wrap');
  if(pw) pw.classList.toggle('open',b);
}

/* ==================== @ Mention System ==================== */
function processPrompt(prompt){
  if(!prompt) return '';
  let result=prompt;
  uploadedImages.forEach((img,i)=>{
    if(img.name){ const re=new RegExp('@'+img.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'); result=result.replace(re,'<Picture '+(i+1)+'>'); }
  });
  uploadedAudios.forEach((aud,i)=>{
    if(aud.name){ const re=new RegExp('@'+aud.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'); result=result.replace(re,'<Audio '+(i+1)+'>'); }
  });
  return result;
}

function updateRefTable(){
  const tbl=document.getElementById('refTable');
  if(!tbl) return;
  const rows=[];
  uploadedImages.forEach((img,i)=>{ if(img.name) rows.push(`<div class="ref-row"><span class="ref-src">@${esc(img.name)}</span><span class="ref-dst">&lt;Picture ${i+1}&gt;</span></div>`); });
  uploadedAudios.forEach((aud,i)=>{ if(aud.name) rows.push(`<div class="ref-row"><span class="ref-src">@${esc(aud.name)}</span><span class="ref-dst">&lt;Audio ${i+1}&gt;</span></div>`); });
  if(rows.length){ tbl.classList.add('open'); tbl.innerHTML='<h4>引用映射</h4>'+rows.join(''); }
  else{ tbl.classList.remove('open'); tbl.innerHTML=''; }
}

let mentionState={active:false,start:0,items:[],index:0};
function handlePromptInput(e){
  const ta=e.target;
  const caret=ta.selectionStart;
  const text=ta.value.substring(0,caret);
  const at=text.lastIndexOf('@');
  if(at>-1 && at===text.length-1 || (at>-1 && !/\s/.test(text.substring(at+1)))){
    mentionState.active=true; mentionState.start=at;
    mentionState.items=getMentionItems();
    mentionState.index=0;
    if(mentionState.items.length){ showMentionDropdown(ta,mentionState.items); }
    else{ hideMentionDropdown(); mentionState.active=false; }
  } else { hideMentionDropdown(); mentionState.active=false; }
  updateRefTable();
}
function getMentionItems(){
  const items=[];
  uploadedImages.forEach(img=>{ if(img.name) items.push({name:img.name,type:'image',icon:'🖼'}); });
  uploadedAudios.forEach(aud=>{ if(aud.name) items.push({name:aud.name,type:'audio',icon:'🎵'}); });
  return items;
}
function showMentionDropdown(ta,items){
  const dd=document.getElementById('mentionDropdown');
  dd.innerHTML=items.map((it,i)=>`<div class="mention-item${i===0?' active':''}" data-name="${esc(it.name)}"><span class="mi-icon">${it.icon}</span>${esc(it.name)}</div>`).join('');
  const rect=ta.getBoundingClientRect();
  dd.style.top=(rect.bottom+window.scrollY+4)+'px';
  dd.style.left=(rect.left+window.scrollX)+'px';
  dd.classList.add('open');
  dd.querySelectorAll('.mention-item').forEach(el=>{
    el.addEventListener('click',()=>insertMention(el.dataset.name));
  });
}
function hideMentionDropdown(){ document.getElementById('mentionDropdown').classList.remove('open'); }
function insertMention(name){
  const ta=document.getElementById('imgPrompt')||document.getElementById('vidPrompt');
  if(!ta) return;
  const before=ta.value.substring(0,mentionState.start);
  const after=ta.value.substring(ta.selectionStart);
  ta.value=before+'@'+name+' '+after;
  hideMentionDropdown(); mentionState.active=false;
  updateRefTable();
  ta.focus();
}

/* ==================== Render Model Selector ==================== */
function renderModelSelector(){
  const c=document.getElementById('modelSelector');
  const models=getAllModels();
  c.innerHTML=models.map(m=>{
    const tagCls=m.tag==='free'?'tag-free':m.tag==='paid'?'tag-paid':'tag-custom';
    const isCustom=customModels.some(cm=>cm.id===m.id);
    return `<div class="model-card${currentModel&&currentModel.id===m.id?' active':''}" onclick="selectModel('${m.id}')">
      <div class="model-icon">${m.icon||'🤖'}</div>
      <div class="model-info"><h3>${esc(m.name)}</h3><p>${esc(m.desc||'')}</p></div>
      <span class="model-tag ${tagCls}">${esc(m.tag||'custom')}</span>
      ${isCustom?`<button class="btn-edit" onclick="event.stopPropagation();editCustomModel('${m.id}')">✎</button>`:''}
    </div>`;
  }).join('')+'<div class="model-add-card" onclick="openModelModal()"><span>+</span><span>添加模型</span></div>';
}
function selectModel(id){
  currentModel=getAllModels().find(m=>m.id===id);
  renderModelSelector(); renderControls();
}

function selectModeTab(el){
  el.parentElement.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const mode=el.dataset.mode;
  const imgArea=document.getElementById('uploadImageArea');
  const audArea=document.getElementById('uploadAudioArea');
  if(imgArea) imgArea.style.display=(mode==='text')?'none':'';
  if(audArea) audArea.style.display=(mode==='reference'&&currentModel&&currentModel.supportsAudio)?'':'none';
}
function applyTemplate(prefix){
  const sel=document.getElementById(prefix+'Template');
  if(!sel.value) return;
  const ta=document.getElementById(prefix+'Prompt');
  ta.value=ta.value?ta.value+'\n'+sel.value:sel.value;
  sel.value='';
}

/* ==================== Upload Handlers ==================== */
function renderUploadArea(type,m){
  const imgArea=`
  <div class="section">
    <label class="section-label">参考图片</label>
    <div class="upload-area" id="uploadImageArea" onclick="document.getElementById('imageFileInput').click()">
      <div class="upload-icon">🖼</div>
      <div class="upload-hint">点击或拖拽上传图片</div>
      <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)" />
    </div>
    <div class="upload-cards" id="imageCards"></div>
  </div>`;
  const audArea=(type==='video'&&m.supportsAudio)?`
  <div class="section" id="uploadAudioSection">
    <label class="section-label">参考音频</label>
    <div class="upload-area" id="uploadAudioArea" onclick="document.getElementById('audioFileInput').click()">
      <div class="upload-icon">🎵</div>
      <div class="upload-hint">点击或拖拽上传音频 (MP3/WAV)</div>
      <input type="file" id="audioFileInput" accept="audio/*" multiple style="display:none" onchange="handleAudioUpload(event)" />
    </div>
    <div class="upload-cards" id="audioCards"></div>
  </div>`:'';
  return imgArea+audArea;
}
function bindUploadEvents(){
  const imgArea=document.getElementById('uploadImageArea');
  if(imgArea){
    imgArea.addEventListener('dragover',e=>{e.preventDefault();imgArea.classList.add('dragover');});
    imgArea.addEventListener('dragleave',()=>imgArea.classList.remove('dragover'));
    imgArea.addEventListener('drop',e=>{e.preventDefault();imgArea.classList.remove('dragover');handleImageFiles(e.dataTransfer.files);});
  }
  const audArea=document.getElementById('uploadAudioArea');
  if(audArea){
    audArea.addEventListener('dragover',e=>{e.preventDefault();audArea.classList.add('dragover');});
    audArea.addEventListener('dragleave',()=>audArea.classList.remove('dragover'));
    audArea.addEventListener('drop',e=>{e.preventDefault();audArea.classList.remove('dragover');handleAudioFiles(e.dataTransfer.files);});
  }
  renderImageCards(); renderAudioCards();
}
function handleImageUpload(e){ handleImageFiles(e.target.files); e.target.value=''; }
function handleAudioUpload(e){ handleAudioFiles(e.target.files); e.target.value=''; }
function handleImageFiles(files){
  [...files].forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      uploadedImages.push({dataUri:ev.target.result,label:file.name,name:file.name.replace(/\.[^.]+$/,'')});
      renderImageCards(); updateRefTable();
    };
    reader.readAsDataURL(file);
  });
}
function handleAudioFiles(files){
  [...files].forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      uploadedAudios.push({dataUri:ev.target.result,label:file.name,name:file.name.replace(/\.[^.]+$/,'')});
      renderAudioCards(); updateRefTable();
    };
    reader.readAsDataURL(file);
  });
}
function renderImageCards(){
  const c=document.getElementById('imageCards');
  if(!c) return;
  c.innerHTML=uploadedImages.map((img,i)=>{
    const imgIdx=uploadedImages.indexOf(img)+1;
    return `<div class="upload-card">
      <img src="${img.dataUri}" alt="${esc(img.name)}" />
      <input type="text" class="card-name" value="${esc(img.name)}" oninput="updateImageName(${i},this.value)" placeholder="名称" />
      <div class="card-mention">@${esc(img.name)} → &lt;Picture ${imgIdx}&gt;</div>
      <button class="btn-remove" onclick="removeImage(${i})">&times;</button>
    </div>`;
  }).join('');
}
function renderAudioCards(){
  const c=document.getElementById('audioCards');
  if(!c) return;
  c.innerHTML=uploadedAudios.map((aud,i)=>{
    const audIdx=uploadedAudios.indexOf(aud)+1;
    return `<div class="upload-card">
      <audio src="${aud.dataUri}" controls style="height:40px"></audio>
      <input type="text" class="card-name" value="${esc(aud.name)}" oninput="updateAudioName(${i},this.value)" placeholder="名称" />
      <div class="card-mention">@${esc(aud.name)} → &lt;Audio ${audIdx}&gt;</div>
      <button class="btn-remove" onclick="removeAudio(${i})">&times;</button>
    </div>`;
  }).join('');
}
function updateImageName(i,name){ uploadedImages[i].name=name; renderImageCards(); updateRefTable(); }
function updateAudioName(i,name){ uploadedAudios[i].name=name; renderAudioCards(); updateRefTable(); }
function removeImage(i){ uploadedImages.splice(i,1); renderImageCards(); updateRefTable(); }
function removeAudio(i){ uploadedAudios.splice(i,1); renderAudioCards(); updateRefTable(); }

/* ==================== Seed Lock ==================== */
function toggleSeedLock(){
  const btn=document.getElementById('seedLock');
  const input=document.getElementById('seedInput');
  if(lockedSeed!==null){
    lockedSeed=null; btn.textContent='🔓'; btn.classList.remove('locked');
    input.disabled=false;
  } else {
    const s=input.value.trim();
    lockedSeed=s||Math.floor(Math.random()*1000000);
    if(!s) input.value=lockedSeed;
    btn.textContent='🔒'; btn.classList.add('locked');
    input.disabled=true;
  }
}

/* ==================== Image Generation ==================== */
async function generateImage(){
  if(!currentModel){ showToast('请先选择模型','error'); return; }
  const key=getApiKey();
  if(!key){ showToast('请先输入 API Key','error'); return; }
  const prompt=processPrompt(val('imgPrompt'));
  if(!prompt){ showToast('请输入 Prompt','error'); return; }
  setGenerating(true); updateProgress(0,'提交中...');
  try{
    const body={ model:currentModel.modelId, prompt, size:val('imgSize'), aspect_ratio:val('imgRatio') };
    const imgs=uploadedImages.map(i=>i.dataUri);
    if(imgs.length) body.images=imgs;
    const neg=getNegPrompt('imgNegPrompt');
    if(neg) body.negative_prompt=neg;
    const seed=getSeedValue();
    if(seed) body.seed=seed;
    let resp=await fetch('/api/images/generations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const respText=await resp.text();
    let data; try{ data=JSON.parse(respText); }catch(e){ throw new Error(respText||`HTTP ${resp.status}`); }
    if(!resp.ok){ const errMsg=data?.error?.message||data?.detail||data?.message||respText||`HTTP ${resp.status}`; throw new Error(errMsg); }
    // Extract URL from response — API returns result immediately in data.data[0].url
    let imgUrl=data.data?.[0]?.url||data.image_url||data.url||data.data?.image_url||data.data?.url||data.output?.[0]||data.images?.[0];
    if(imgUrl){ updateProgress(100,'完成'); showImageResult(imgUrl,prompt,seed); await addToHistory('image',imgUrl,prompt,seed); return; }
    // Only poll if no URL yet but has task_id
    if(data.task_id||data.id||data.request_id){
      let pollCount=0;
      while(true){
        pollCount++;
        if(pollCount>120) throw new Error('生成超时');
        updateProgress(Math.min(90,pollCount/120*90),'生成中 '+pollCount+'...');
        await new Promise(r=>setTimeout(r,3000));
        const pid=data.task_id||data.id||data.request_id;
        const pollResp=await fetch(`/api/videos/${pid}`,{headers:{'Authorization':'Bearer '+key}});
        const pollText=await pollResp.text();
        try{ data=JSON.parse(pollText); }catch(e){ continue; }
        if(data.status==='completed'||data.status==='succeeded'||data.state==='SUCCESS'){
          imgUrl=data.data?.[0]?.url||data.image_url||data.url||data.data?.image_url||data.data?.url||data.metadata?.url||data.output?.[0];
          if(imgUrl){ updateProgress(100,'完成'); showImageResult(imgUrl,prompt,seed); await addToHistory('image',imgUrl,prompt,seed); return; }
        }
        if(data.state==='FAILED'||data.status==='failed') throw new Error(data.error?.message||data.error||'生成失败');
      }
    }
    throw new Error('未获取到图片结果');
  }catch(e){ showToast('生成失败: '+e.message,'error'); }
  finally{ setGenerating(false); }
}
/* Helper: download media via backend proxy (avoids CORS) */
async function downloadMedia(url, filename){
  try{
    // If already a local path (/media/xxx), download directly
    if(url.startsWith('/media/') || url.startsWith('/tmp/')){
      const a=document.createElement('a');
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return;
    }
    // Remote URL: fetch through backend and trigger download
    const resp=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,filename})});
    const data=await resp.json();
    if(data.success && data.url){
      const a=document.createElement('a');
      a.href=data.url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }else{
      throw new Error(data.error?.message||'下载失败');
    }
  }catch(e){
    showToast('下载失败: '+e.message,'error');
  }
}

function showImageResult(url,prompt,seed){
  const ra=document.getElementById('resultArea');
  ra.innerHTML=`<div class="result-content">
    <img src="${url}" alt="result" />
    <div class="result-actions"><button class="btn btn-accent" onclick="downloadMedia('${url}','image_${Date.now()}.png')">⬇ 下载</button></div>
    <div class="result-meta">
      <div class="meta-row"><span class="meta-label">模型</span><span class="meta-val">${esc(currentModel.name)}</span></div>
      <div class="meta-row"><span class="meta-label">Prompt</span><span class="meta-val">${esc(prompt)}</span></div>
      ${seed?`<div class="meta-row"><span class="meta-label">Seed</span><span class="meta-val">${seed}</span></div>`:''}
    </div>
  </div>`;
}

/* ==================== Video Generation ==================== */
async function generateVideo(){
  if(!currentModel){ showToast('请先选择模型','error'); return; }
  const key=getApiKey();
  if(!key){ showToast('请先输入 API Key','error'); return; }
  const prompt=processPrompt(val('vidPrompt'));
  if(!prompt){ showToast('请输入 Prompt','error'); return; }
  const mode=document.querySelector('.mode-tab.active')?.dataset.mode||'text';
  setGenerating(true); updateProgress(0,'提交中...');
  try{
    const body={ model:currentModel.modelId, prompt, seconds:String(val('vidSeconds')), mode, size:val('vidSize'), aspect_ratio:val('vidRatio') };
    if(mode==='reference'||mode==='keyframe'){
      const imgs=uploadedImages.map(i=>i.dataUri);
      if(imgs.length) body.images=imgs;
      const auds=uploadedAudios.map(a=>a.dataUri);
      if(auds.length&&currentModel.supportsAudio) body.audios=auds;
    }
    const neg=getNegPrompt('vidNegPrompt');
    if(neg) body.negative_prompt=neg;
    const seed=getSeedValue();
    if(seed) body.seed=seed;
    let resp=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const respText=await resp.text();
    let data; try{ data=JSON.parse(respText); }catch(e){ throw new Error(respText||`HTTP ${resp.status}`); }
    if(!resp.ok){ const errMsg=data?.error?.message||data?.detail||data?.message||respText||`HTTP ${resp.status}`; throw new Error(errMsg); }
    const videoId=data.task_id||data.id||data.request_id||data.video_id;
    if(videoId){
      const url=await pollVideoTask(videoId,key,(p,status)=>updateProgress(p,'生成中 '+Math.round(p)+'%'+(status?' ('+status+')':'')));
      updateProgress(100,'完成'); showVideoResult(url,prompt,seed); await addToHistory('video',url,prompt,seed);
    } else {
      const url=data.metadata?.url||data.video_url||data.url||data.data?.video_url;
      if(url){ updateProgress(100,'完成'); showVideoResult(url,prompt,seed); await addToHistory('video',url,prompt,seed); }
      else throw new Error('未获取到视频结果');
    }
  }catch(e){ showToast('生成失败: '+e.message,'error'); }
  finally{ setGenerating(false); }
}
async function pollVideoTask(videoId,apiKey,onProgress){
  const maxRetries=120;
  let lastProgress=0;
  for(let i=0;i<maxRetries;i++){
    await new Promise(r=>setTimeout(r,3000));
    const resp=await fetch(`/api/videos/${videoId}`,{headers:{'Authorization':'Bearer '+apiKey}});
    const text=await resp.text();
    let data; try{ data=JSON.parse(text); }catch(e){
      if(i>5) console.warn('Poll parse error, attempt',i,text.substring(0,200));
      continue;
    }
    if(!resp.ok){
      if(resp.status===404) throw new Error('任务不存在或已过期');
      if(i>3) console.warn('Poll HTTP',resp.status);
      continue;
    }
    if(data.status==='completed'||data.status==='succeeded'||data.state==='SUCCESS'){
      const url=data.metadata?.url||data.video_url||data.url||data.data?.video_url;
      if(url) return url;
      throw new Error('视频已完成但未获取到URL');
    }
    if(data.state==='FAILED'||data.status==='failed') throw new Error(data.error?.message||data.error||'生成失败');
    const apiProgress=data.progress??0;
    if(apiProgress>lastProgress) lastProgress=apiProgress;
    if(onProgress){
      const displayProgress=Math.max(lastProgress,Math.min(90,(i/maxRetries)*100));
      onProgress(displayProgress, data.status||data.state||'');
    }
  }
  throw new Error('生成超时（已等待6分钟）');
}
function showVideoResult(url,prompt,seed){
  const ra=document.getElementById('resultArea');
  ra.innerHTML=`<div class="result-content">
    <video src="${url}" controls autoplay loop></video>
    <div class="result-actions"><button class="btn btn-accent" onclick="downloadMedia('${url}','video_${Date.now()}.mp4')">⬇ 下载</button></div>
    <div class="result-meta">
      <div class="meta-row"><span class="meta-label">模型</span><span class="meta-val">${esc(currentModel.name)}</span></div>
      <div class="meta-row"><span class="meta-label">Prompt</span><span class="meta-val">${esc(prompt)}</span></div>
      ${seed?`<div class="meta-row"><span class="meta-label">Seed</span><span class="meta-val">${seed}</span></div>`:''}
    </div>
  </div>`;
}
function updateProgress(pct,text){
  const fill=document.getElementById('progressFill');
  const txt=document.getElementById('progressText');
  if(fill) fill.style.width=pct+'%';
  if(txt&&text) txt.textContent=text;
}

/* ==================== History ==================== */
function loadHistory(){
  try{ history=JSON.parse(localStorage.getItem('ai_studio_history')||'[]'); }catch(e){ history=[]; }
  fetch('/api/history').then(r=>r.json()).then(data=>{
    if(data.success&&data.history&&data.history.length>0){
      const backendUrls=data.history.map(h=>h.src);
      const localOnly=history.filter(h=>!backendUrls.includes(h.src));
      history=[...data.history,...localOnly].slice(0,50);
      renderHistory();
    }
  }).catch(()=>{});
}
function saveHistory(){
  localStorage.setItem('ai_studio_history',JSON.stringify(history));
  fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history})}).catch(()=>{});
}
async function addToHistory(type,src,prompt,seed){
  let localSrc=src;
  if(src&&!src.startsWith('/media/')&&!src.startsWith('/tmp/')&&!src.startsWith('blob:')){
    try{
      const resp=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:src,type})});
      const data=await resp.json();
      if(data.success&&data.url) localSrc=data.url;
    }catch(e){ console.error('Download failed:',e); }
  }
  history.unshift({type,src:localSrc,prompt,time:new Date().toLocaleString(),seed:seed||null});
  if(history.length>50) history=history.slice(0,50);
  saveHistory(); renderHistory();
}
function renderHistory(){
  const g=document.getElementById('historyGrid');
  if(!history.length){ g.innerHTML='<div class="history-empty">暂无历史记录</div>'; return; }
  g.innerHTML=history.map((h,i)=>{
    const isImg=h.type==='image';
    const thumb=isImg?`<img src="${esc(h.src)}" alt="" />`:`<video src="${esc(h.src)}" muted></video>`;
    return `<div class="history-item" onclick="viewHistory(${i})">
      ${thumb}
      <span class="h-type ${isImg?'h-type-img':'h-type-vid'}">${isImg?'IMG':'VID'}</span>
    </div>`;
  }).join('');
}
function viewHistory(i){
  const h=history[i];
  if(!h) return;
  const ra=document.getElementById('resultArea');
  const media=h.type==='image'?`<img src="${esc(h.src)}" alt="result" />`:`<video src="${esc(h.src)}" controls autoplay loop></video>`;
  ra.innerHTML=`<div class="result-content">
    ${media}
    <div class="result-actions"><button class="btn btn-accent" onclick="downloadMedia('${esc(h.src)}','${h.type}_${i}')">⬇ 下载</button></div>
    <div class="result-meta">
      <div class="meta-row"><span class="meta-label">类型</span><span class="meta-val">${h.type==='image'?'图片':'视频'}</span></div>
      <div class="meta-row"><span class="meta-label">Prompt</span><span class="meta-val">${esc(h.prompt)}</span></div>
      <div class="meta-row"><span class="meta-label">时间</span><span class="meta-val">${esc(h.time)}</span></div>
      ${h.seed?`<div class="meta-row"><span class="meta-label">Seed</span><span class="meta-val">${esc(h.seed)}</span></div>`:''}
    </div>
  </div>`;
}
function clearHistory(){
  if(!confirm('确定清空所有历史记录?')) return;
  history=[]; saveHistory(); renderHistory();
  showToast('历史记录已清空','success');
}

/* ==================== Custom Models ==================== */
function loadCustomModels(){
  try{ customModels=JSON.parse(localStorage.getItem('custom_models')||'[]'); }catch(e){ customModels=[]; }
}
function saveCustomModels(){
  localStorage.setItem('custom_models',JSON.stringify(customModels));
}
function openModelModal(){
  document.getElementById('modalTitle').textContent='自定义模型';
  document.getElementById('cmId').value='';
  document.getElementById('cmName').value='';
  document.getElementById('cmModelId').value='';
  document.getElementById('cmType').value='image';
  document.getElementById('cmTag').value='free';
  document.getElementById('cmIcon').value='🤖';
  document.getElementById('cmApiBase').value='';
  document.getElementById('cmSizes').value='1K,2K,4K';
  document.getElementById('cmRatios').value='1:1,16:9,9:16,4:3,3:4';
  document.getElementById('cmMaxImages').value=5;
  document.getElementById('cmDurations').value='4,5,6,7,8,9,10,11,12';
  document.getElementById('cmVSizes').value='720P,960P,2K';
  document.getElementById('cmVRatios').value='16:9,9:16,4:3,1:1';
  document.getElementById('cmAudio').checked=true;
  document.getElementById('cmVideoRef').checked=false;
  document.querySelectorAll('.cmMode').forEach(cb=>cb.checked=true);
  toggleCmFields();
  renderCustomModelList();
  document.getElementById('modelModal').classList.add('open');
}
function closeModelModal(){ document.getElementById('modelModal').classList.remove('open'); }
function toggleCmFields(){
  const type=document.getElementById('cmType').value;
  document.getElementById('cmImageFields').style.display=type==='image'?'':'none';
  document.getElementById('cmVideoFields').style.display=type==='video'?'':'none';
}
function saveCustomModel(){
  const id=document.getElementById('cmId').value;
  const name=document.getElementById('cmName').value.trim();
  const modelId=document.getElementById('cmModelId').value.trim();
  if(!name||!modelId){ showToast('请填写名称和模型ID','error'); return; }
  const type=document.getElementById('cmType').value;
  const model={
    id:id||('custom-'+Date.now()),
    name, modelId, type,
    tag:document.getElementById('cmTag').value,
    icon:document.getElementById('cmIcon').value.trim()||'🤖',
    desc:type==='image'?'自定义图片模型':'自定义视频模型'
  };
  const apiBase=document.getElementById('cmApiBase').value.trim();
  if(apiBase) model.apiBase=apiBase;
  if(type==='image'){
    model.sizes=document.getElementById('cmSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    model.ratios=document.getElementById('cmRatios').value.split(',').map(s=>s.trim()).filter(Boolean);
  } else {
    model.modes=[...document.querySelectorAll('.cmMode:checked')].map(cb=>cb.value);
    model.maxImages=parseInt(document.getElementById('cmMaxImages').value)||5;
    model.durations=document.getElementById('cmDurations').value.split(',').map(s=>parseInt(s.trim())).filter(Boolean);
    model.sizes=document.getElementById('cmVSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    model.ratios=document.getElementById('cmVRatios').value.split(',').map(s=>s.trim()).filter(Boolean);
    model.supportsAudio=document.getElementById('cmAudio').checked;
    model.supportsVideoRef=document.getElementById('cmVideoRef').checked;
  }
  const idx=customModels.findIndex(m=>m.id===model.id);
  if(idx>-1) customModels[idx]=model; else customModels.push(model);
  saveCustomModels();
  if(currentModel&&currentModel.id===model.id) currentModel=model;
  renderModelSelector(); renderCustomModelList();
  showToast('模型已保存','success');
  closeModelModal();
}
function editCustomModel(id){
  const m=customModels.find(cm=>cm.id===id);
  if(!m) return;
  document.getElementById('modalTitle').textContent='编辑模型';
  document.getElementById('cmId').value=m.id;
  document.getElementById('cmName').value=m.name;
  document.getElementById('cmModelId').value=m.modelId;
  document.getElementById('cmType').value=m.type;
  document.getElementById('cmTag').value=m.tag||'free';
  document.getElementById('cmIcon').value=m.icon||'🤖';
  document.getElementById('cmApiBase').value=m.apiBase||'';
  if(m.type==='image'){
    document.getElementById('cmSizes').value=(m.sizes||[]).join(',');
    document.getElementById('cmRatios').value=(m.ratios||[]).join(',');
  } else {
    document.getElementById('cmMaxImages').value=m.maxImages||5;
    document.getElementById('cmDurations').value=(m.durations||[]).join(',');
    document.getElementById('cmVSizes').value=(m.sizes||[]).join(',');
    document.getElementById('cmVRatios').value=(m.ratios||[]).join(',');
    document.getElementById('cmAudio').checked=!!m.supportsAudio;
    document.getElementById('cmVideoRef').checked=!!m.supportsVideoRef;
    document.querySelectorAll('.cmMode').forEach(cb=>cb.checked=(m.modes||[]).includes(cb.value));
  }
  toggleCmFields();
  renderCustomModelList();
  document.getElementById('modelModal').classList.add('open');
}
function deleteCustomModel(id){
  if(!confirm('确定删除此模型?')) return;
  customModels=customModels.filter(m=>m.id!==id);
  saveCustomModels();
  if(currentModel&&currentModel.id===id){ currentModel=getAllModels()[0]; renderControls(); }
  renderModelSelector(); renderCustomModelList();
  showToast('模型已删除','success');
}
function renderCustomModelList(){
  const c=document.getElementById('customModelList');
  if(!customModels.length){ c.innerHTML='<p style="color:var(--muted);font-size:12px">暂无自定义模型</p>'; return; }
  c.innerHTML=customModels.map(m=>`
    <div class="modal-list-item">
      <span>${esc(m.icon)} ${esc(m.name)} <span style="color:var(--muted)">(${esc(m.modelId)})</span></span>
      <span>
        <button class="btn" style="padding:4px 10px;font-size:11px" onclick="editCustomModel('${m.id}')">编辑</button>
        <button class="btn" style="padding:4px 10px;font-size:11px;border-color:var(--error);color:var(--error)" onclick="deleteCustomModel('${m.id}')">删除</button>
      </span>
    </div>`).join('');
}

/* ==================== Keyboard for Mentions ==================== */
document.addEventListener('keydown',e=>{
  if(!mentionState.active) return;
  const dd=document.getElementById('mentionDropdown');
  if(!dd.classList.contains('open')) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); mentionState.index=(mentionState.index+1)%mentionState.items.length; updateMentionActive(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); mentionState.index=(mentionState.index-1+mentionState.items.length)%mentionState.items.length; updateMentionActive(); }
  else if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); const it=mentionState.items[mentionState.index]; if(it) insertMention(it.name); }
  else if(e.key==='Escape'){ hideMentionDropdown(); mentionState.active=false; }
});
function updateMentionActive(){
  document.querySelectorAll('.mention-item').forEach((el,i)=>el.classList.toggle('active',i===mentionState.index));
}

/* ==================== Init ==================== */
window.addEventListener('load',()=>{
  const saved=getApiKey();
  if(saved) document.getElementById('apiKey').value=saved;
  loadCustomModels();
  currentModel=getAllModels()[0];
  loadHistory(); renderHistory();
  renderModelSelector(); renderControls();
  initUpdater();
});

/* ==================== Auto Update ==================== */
function isElectron(){
  return typeof window.electronAPI!=='undefined' && window.electronAPI.isElectron();
}

async function initUpdater(){
  if(!isElectron()){
    const badge=document.getElementById('versionBadge');
    if(badge){ badge.textContent='Web版'; badge.style.cursor='default'; }
    return;
  }
  try{
    const ver=await window.electronAPI.getAppVersion();
    const badge=document.getElementById('versionBadge');
    if(badge) badge.textContent='v'+ver;

    // Listen for auto-update events
    window.electronAPI.onUpdateAvailable((info)=>{
      showUpdateBanner(info.version, info.releaseNotes);
    });
    window.electronAPI.onDownloadProgress((progress)=>{
      const banner=document.getElementById('updateBanner');
      const right=document.getElementById('updateBannerRight');
      if(right){
        right.innerHTML='<div style="text-align:center"><div>下载中 '+progress.percent+'%</div><div class="update-progress-bar"><div class="update-progress-fill" style="width:'+progress.percent+'%"></div></div></div>';
      }
    });
    window.electronAPI.onUpdateDownloaded((info)=>{
      const right=document.getElementById('updateBannerRight');
      const text=document.getElementById('updateBannerText');
      if(text) text.textContent='更新已下载完成，立即安装？';
      if(right){
        right.innerHTML='<button class="btn" onclick="installUpdate()">立即安装并重启</button><button class="btn" onclick="closeUpdateBanner()">稍后</button>';
      }
    });
    window.electronAPI.onUpdateError((error)=>{
      showToast('更新出错: '+error.message,'error');
      closeUpdateBanner();
    });
  }catch(e){ console.warn('Updater init failed:',e); }
}

function showUpdateBanner(version, notes){
  const banner=document.getElementById('updateBanner');
  const text=document.getElementById('updateBannerText');
  const right=document.getElementById('updateBannerRight');
  if(text) text.textContent='发现新版本 v'+version+(notes?'：'+notes:'');
  if(right){
    right.innerHTML='<button class="btn" onclick="downloadUpdate()">立即更新</button><button class="btn" onclick="closeUpdateBanner()">稍后</button>';
  }
  if(banner) banner.classList.add('open');
}

function closeUpdateBanner(){
  const banner=document.getElementById('updateBanner');
  if(banner) banner.classList.remove('open');
}

async function checkForUpdates(){
  if(!isElectron()){ showToast('Web版不支持自动更新，请刷新页面获取最新版本','warn'); return; }
  showToast('正在检查更新...','');
  try{
    const result=await window.electronAPI.checkForUpdates();
    if(result.success && result.hasUpdate){
      showUpdateBanner(result.version,'');
    } else if(result.success){
      showToast('已是最新版本','success');
    } else {
      showToast('检查更新失败: '+result.error,'error');
    }
  }catch(e){
    showToast('检查更新失败: '+e.message,'error');
  }
}

async function downloadUpdate(){
  if(!isElectron()) return;
  const right=document.getElementById('updateBannerRight');
  if(right){
    right.innerHTML='<div style="text-align:center"><div>下载中 0%</div><div class="update-progress-bar"><div class="update-progress-fill" style="width:0"></div></div></div>';
  }
  try{
    const result=await window.electronAPI.downloadUpdate();
    if(!result.success){
      showToast('下载更新失败: '+result.error,'error');
      closeUpdateBanner();
    }
  }catch(e){
    showToast('下载更新失败: '+e.message,'error');
    closeUpdateBanner();
  }
}

async function installUpdate(){
  if(!isElectron()) return;
  await window.electronAPI.installUpdate();
}
