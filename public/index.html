<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro — 任务管理看板</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --border:#e8e8e8; --border-dark:#d0d0d0;
  --text:#333; --muted:#999; --accent:#00b578; --accent-light:#e6f7f0;
  --success:#00b578; --error:#ff4d4f; --warn:#faad14; --info:#1890ff;
  --radius:8px; --shadow:0 2px 8px rgba(0,0,0,.06); --shadow-lg:0 4px 16px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;font-size:14px;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#aaa}
textarea,input,select,button{font-family:inherit}
textarea{resize:vertical}
a{color:var(--accent);text-decoration:none}

/* ===== Top Bar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);height:56px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--text)}
.logo-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:10px}
.apikey-bar{display:flex;align-items:center;gap:8px}
.apikey-bar input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;color:var(--text);font-size:13px;width:220px;outline:none;transition:border-color .2s}
.apikey-bar input:focus{border-color:var(--accent)}
.version-badge{font-size:11px;color:var(--muted);padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
.version-badge:hover{color:var(--accent);border-color:var(--accent)}

/* ===== Buttons ===== */
.btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;color:var(--text);cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-accent{background:var(--accent);border:1px solid var(--accent);color:#fff}
.btn-accent:hover{background:#00a069;border-color:#00a069;color:#fff}
.btn-primary{background:var(--accent);border:1px solid var(--accent);color:#fff}
.btn-primary:hover{background:#00a069;border-color:#00a069;color:#fff}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.btn-danger{border-color:var(--error);color:var(--error)}
.btn-danger:hover{background:#fff1f0;border-color:var(--error);color:var(--error)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== Project Tabs ===== */
.project-tabs{display:flex;align-items:center;gap:8px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.project-tab{display:flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--muted);background:var(--surface);transition:all .2s;white-space:nowrap}
.project-tab:hover{color:var(--text);border-color:var(--border-dark)}
.project-tab.active{color:var(--accent);border:2px solid var(--accent);padding:5px 13px;background:var(--accent-light);font-weight:600}
.project-tab .pt-name{cursor:pointer}
.project-tab .pt-actions{display:none;gap:4px;margin-left:4px}
.project-tab:hover .pt-actions{display:flex}
.project-tab .pt-actions button{background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);padding:0 2px}
.project-tab .pt-actions button:hover{color:var(--accent)}
.project-add{padding:6px 14px;border:1px dashed var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap}
.project-add:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Action Bar ===== */
.action-bar{display:flex;align-items:center;gap:8px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.action-bar .btn-create{font-weight:600}
.action-bar .spacer{flex:1}
.action-bar .view-tab{padding:6px 16px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--muted);background:var(--surface);transition:all .2s}
.action-bar .view-tab:hover{color:var(--text)}
.action-bar .view-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== Filter Bar ===== */
.filter-bar{display:flex;align-items:center;gap:8px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.filter-bar .filter-select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:13px;color:var(--text);cursor:pointer;outline:none}
.filter-bar .filter-select:hover{border-color:var(--accent)}
.filter-bar .filter-select:focus{border-color:var(--accent)}
.filter-bar .filter-label{font-size:12px;color:var(--muted)}
.filter-bar .select-all-wrap{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--text)}
.filter-bar .select-all-wrap input{cursor:pointer}
.filter-bar .spacer{flex:1}
.filter-bar .stats-info{font-size:12px;color:var(--muted)}

/* ===== Task List ===== */
.task-list-container{padding:16px 24px;max-width:1200px;margin:0 auto}
.task-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
.task-empty .empty-icon{font-size:48px;margin-bottom:12px;opacity:.3}

/* ===== Task Card ===== */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s}
.task-card:hover{border-color:var(--border-dark)}
.task-card.expanded{border-color:var(--accent)}
.task-card-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.task-card-header:hover{background:#fafafa}
.task-checkbox{width:16px;height:16px;cursor:pointer;flex-shrink:0}
.task-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.status-completed{background:var(--accent-light);color:var(--success);border:1px solid var(--success)}
.status-generating{background:#fff7e6;color:var(--warn);border:1px solid var(--warn)}
.status-failed{background:#fff1f0;color:var(--error);border:1px solid var(--error)}
.task-time{font-size:12px;color:var(--muted);white-space:nowrap}
.task-id{font-size:12px;color:var(--muted);font-family:monospace;white-space:nowrap}
.task-expand-icon{margin-left:auto;font-size:12px;color:var(--muted);transition:transform .2s}
.task-card.expanded .task-expand-icon{transform:rotate(180deg)}
.task-card-body{display:flex;gap:16px;padding:0 16px 12px 16px}
.task-thumb{width:100px;height:100px;border-radius:6px;overflow:hidden;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.task-thumb img,.task-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.task-thumb-placeholder{font-size:32px;opacity:.3}
.task-info{flex:1;min-width:0}
.task-prompt{font-size:13px;color:var(--text);margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-specs{display:flex;flex-wrap:wrap;gap:6px}
.spec-item{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}
.task-actions{display:flex;gap:6px;padding:0 16px 12px 16px}
.task-detail{display:none;padding:0 16px 16px 16px;border-top:1px solid var(--border);margin-top:4px}
.task-card.expanded .task-detail{display:block}
.task-detail-media{margin:12px 0;text-align:center}
.task-detail-media img,.task-detail-media video{max-width:100%;max-height:400px;border-radius:var(--radius);border:1px solid var(--border)}
.task-detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-top:12px}
.task-detail-meta .meta-row{display:flex;gap:8px}
.task-detail-meta .meta-label{color:var(--muted);min-width:60px;flex-shrink:0}
.task-detail-meta .meta-val{color:var(--text);word-break:break-all}
.task-progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:8px}
.task-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* ===== Card Progress (visible when collapsed) ===== */
.card-progress-wrap{padding:0 16px 8px;display:flex;align-items:center;gap:10px}
.card-progress-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.card-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#00d69a);border-radius:3px;transition:width .5s ease;animation:progress-shimmer 1.5s infinite}
.card-progress-text{font-size:12px;color:var(--accent);white-space:nowrap;min-width:80px;text-align:right}
@keyframes progress-shimmer{0%{opacity:1}50%{opacity:.7}100%{opacity:1}}

/* ===== Create Task Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:12px;width:680px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h2{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 24px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}

/* Form Elements */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:90px}
.field-row{display:flex;gap:12px}
.field-row>*{flex:1}

/* Mode Tabs */
.mode-tabs{display:flex;gap:6px;margin-bottom:10px}
.mode-tab{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted);transition:all .2s}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Negative Prompt */
.negative-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none;margin-bottom:6px}
.negative-toggle:hover{color:var(--text)}
.negative-body{display:none}
.negative-body.open{display:block}

/* Upload Area */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted)}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-hint{font-size:12px}
.upload-area input[type=file]{display:none}
.upload-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.upload-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px;position:relative}
.upload-card img,.upload-card audio{width:100%;border-radius:6px;display:block;max-height:100px;object-fit:cover}
.upload-card .card-name{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text);font-size:11px;width:100%;margin-top:6px;outline:none}
.upload-card .card-name:focus{border-color:var(--accent)}
.upload-card .card-mention{font-size:10px;color:var(--accent);margin-top:4px;text-align:center}
.upload-card .btn-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.5);border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.upload-card .btn-remove:hover{background:var(--error)}

/* Reference Mapping */
.ref-table{margin-top:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-size:12px;display:none}
.ref-table.open{display:block}
.ref-table h4{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.ref-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border)}
.ref-row:last-child{border:none}
.ref-row .ref-src{color:var(--info)}
.ref-row .ref-dst{color:var(--success)}

/* @ Mention Dropdown */
.mention-dropdown{position:absolute;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:200px;overflow-y:auto;z-index:300;display:none;min-width:200px}
.mention-dropdown.open{display:block}
.mention-item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.mention-item:hover,.mention-item.active{background:var(--accent-light)}
.mention-item .mi-icon{font-size:14px}
.prompt-wrap{position:relative}

/* Seed Row */
.seed-row{display:flex;gap:8px;align-items:center}
.seed-row input{flex:1}
.btn-lock{flex:0 0 auto;width:36px;height:36px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--muted);transition:all .2s}
.btn-lock.locked{color:var(--warn);border-color:var(--warn)}

/* Checkbox Group */
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.checkbox-item input{width:auto}

/* Modal List */
.modal-list{margin-bottom:14px}
.modal-list h4{font-size:12px;color:var(--muted);margin-bottom:8px}
.modal-list-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:6px;font-size:12px}

/* ===== Toast ===== */
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 18px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
.toast-success{border-color:var(--success);color:var(--success)}
.toast-error{border-color:var(--error);color:var(--error)}
.toast-warn{border-color:var(--warn);color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== Update Banner ===== */
.update-banner{position:fixed;top:0;left:0;right:0;background:var(--accent);color:#fff;padding:10px 24px;display:none;align-items:center;justify-content:space-between;z-index:150;font-size:13px;box-shadow:0 2px 12px rgba(0,181,120,.3)}
.update-banner.open{display:flex;animation:slideDown .3s ease}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.update-banner .ub-left{display:flex;align-items:center;gap:10px}
.update-banner .ub-right{display:flex;align-items:center;gap:8px}
.update-banner .btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff}
.update-banner .btn:hover{background:rgba(255,255,255,.3)}
.update-progress-bar{width:200px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-top:4px}
.update-progress-fill{height:100%;background:#fff;transition:width .3s;border-radius:3px}

/* ===== Pagination ===== */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:20px 0}
.pagination .btn{min-width:32px;text-align:center}
.pagination .page-info{font-size:13px;color:var(--muted)}

/* ===== Batch Panel ===== */
.batch-panel{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 16px;margin-bottom:12px;display:none;align-items:center;gap:10px}
.batch-panel.open{display:flex}
.batch-panel .batch-info{font-size:13px;color:var(--accent)}
</style>
</head>
<body>

<!-- Update Banner -->
<div class="update-banner" id="updateBanner">
  <div class="ub-left">
    <span>🚀</span>
    <span id="updateBannerText">发现新版本！</span>
  </div>
  <div class="ub-right" id="updateBannerRight">
    <button class="btn" onclick="downloadUpdate()">立即更新</button>
    <button class="btn" onclick="closeUpdateBanner()">稍后</button>
  </div>
</div>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">AI</div>
    <span>AI Studio Pro</span>
    <span class="version-badge" id="versionBadge" onclick="checkForUpdates()" title="点击检查更新">v?</span>
  </div>
  <div class="topbar-right">
    <div class="apikey-bar">
      <input type="password" id="apiKey" placeholder="输入 API Key..." />
      <button class="btn btn-primary" onclick="saveApiKey()">保存</button>
    </div>
    <button class="btn" onclick="openModelModal()">自定义模型</button>
  </div>
</div>

<!-- Project Tabs -->
<div class="project-tabs" id="projectTabs"></div>

<!-- Action Bar -->
<div class="action-bar">
  <button class="btn btn-accent btn-create" onclick="openCreateModal()">+ 创建任务</button>
  <button class="view-tab" id="viewTabDrafts" onclick="switchView('drafts')">暂存列表</button>
  <button class="view-tab active" id="viewTabTasks" onclick="switchView('tasks')">任务列表</button>
  <div class="spacer"></div>
  <span id="taskCountBadge" style="font-size:12px;color:var(--muted)"></span>
</div>

<!-- Filter Bar -->
<div class="filter-bar" id="filterBar">
  <label class="select-all-wrap"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)" /> 本页全选</label>
  <select class="filter-select" id="sortSelect" onchange="applyFilters()">
    <option value="desc">时间倒序</option>
    <option value="asc">时间正序</option>
  </select>
  <select class="filter-select" id="statusFilter" onchange="applyFilters()">
    <option value="all">全部状态</option>
    <option value="completed">已完成</option>
    <option value="generating">生成中</option>
    <option value="failed">失败</option>
  </select>
  <select class="filter-select" id="perPageSelect" onchange="onPerPageChange()">
    <option value="10">10条/页</option>
    <option value="20">20条/页</option>
    <option value="50">50条/页</option>
  </select>
  <button class="btn btn-sm" onclick="refreshTasks()">刷新</button>
  <button class="btn btn-sm btn-danger" onclick="cleanupFailedTasks()">清理</button>
  <div class="spacer"></div>
  <span class="stats-info" id="statsInfo"></span>
</div>

<!-- Batch Panel -->
<div class="batch-panel" id="batchPanel">
  <span class="batch-info" id="batchInfo">已选择 0 个任务</span>
  <button class="btn btn-sm btn-danger" onclick="batchDeleteTasks()">批量删除</button>
  <button class="btn btn-sm" onclick="clearSelection()">取消选择</button>
</div>

<!-- Task List -->
<div class="task-list-container" id="taskListContainer">
  <div class="task-empty">
    <div class="empty-icon">📋</div>
    <p>暂无任务，点击"创建任务"开始</p>
  </div>
</div>

<!-- Pagination -->
<div class="pagination" id="pagination" style="display:none"></div>

<!-- Mention Dropdown -->
<div class="mention-dropdown" id="mentionDropdown"></div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Create Task Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="createModalTitle">创建任务</h2>
      <button class="modal-close" onclick="closeCreateModal()">&times;</button>
    </div>
    <div class="modal-body" id="createModalBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="saveDraft()">保存到暂存</button>
      <button class="btn" onclick="closeCreateModal()">取消</button>
      <button class="btn btn-primary" id="submitTaskBtn" onclick="submitTask()">提交任务</button>
    </div>
  </div>
</div>

<!-- Custom Model Modal -->
<div class="modal-overlay" id="modelModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">自定义模型</h2>
      <button class="modal-close" onclick="closeModelModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="cmId" />
      <div class="field-row">

/* ==================== Helpers ==================== */
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let cachedApiKey = '';
function getApiKey(){
  if(window.electronAPI && window.electronAPI.getApiKey) return cachedApiKey||'';

}
async function saveApiKey(){
  const k=document.getElementById('apiKey').value.trim();

  if(window.electronAPI && window.electronAPI.saveApiKey){
    const ok=await window.electronAPI.saveApiKey(k);
    if(ok){ cachedApiKey=k; showToast('API Key 已安全保存','success'); }
    else { showToast('API Key 保存失败','error'); }
  }else{
    localStorage.setItem('agnes_api_key',k);
    showToast('API Key 已保存','success');
  }
}

}

}

/* ==================== @ Mention System ==================== */
function processPrompt(prompt){
  if(!prompt) return '';
  let result=prompt;
  uploadedImages.forEach((img,i)=>{
    if(img.name){ const re=new RegExp('@'+img.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'); result=result.replace(re,'<Picture '+(i+1)+'>'); }
  });
  uploadedAudios.forEach((aud,i)=>{
    if(aud.name){ const re=new RegExp('@'+aud.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'); result=result.replace(re,'<Audio '+(i+1)+'>'); }
  });
  return result;
}

function updateRefTable(){
  const tbl=document.getElementById('refTable');
  if(!tbl) return;
  const rows=[];
  uploadedImages.forEach((img,i)=>{ if(img.name) rows.push(`<div class="ref-row"><span class="ref-src">@${esc(img.name)}</span><span class="ref-dst">&lt;Picture ${i+1}&gt;</span></div>`); });
  uploadedAudios.forEach((aud,i)=>{ if(aud.name) rows.push(`<div class="ref-row"><span class="ref-src">@${esc(aud.name)}</span><span class="ref-dst">&lt;Audio ${i+1}&gt;</span></div>`); });
  if(rows.length){ tbl.classList.add('open'); tbl.innerHTML='<h4>引用映射</h4>'+rows.join(''); }
  else{ tbl.classList.remove('open'); tbl.innerHTML=''; }
}

let mentionState={active:false,start:0,items:[],index:0};
function handlePromptInput(e){
  const ta=e.target;
  const caret=ta.selectionStart;
  const text=ta.value.substring(0,caret);
  const at=text.lastIndexOf('@');
  if(at>-1 && at===text.length-1 || (at>-1 && !/\s/.test(text.substring(at+1)))){
    mentionState.active=true; mentionState.start=at;
    mentionState.items=getMentionItems();
    mentionState.index=0;
    if(mentionState.items.length){ showMentionDropdown(ta,mentionState.items); }
    else{ hideMentionDropdown(); mentionState.active=false; }
  } else { hideMentionDropdown(); mentionState.active=false; }
  updateRefTable();
}
function getMentionItems(){
  const items=[];
  uploadedImages.forEach(img=>{ if(img.name) items.push({name:img.name,type:'image',icon:'🖼'}); });
  uploadedAudios.forEach(aud=>{ if(aud.name) items.push({name:aud.name,type:'audio',icon:'🎵'}); });
  return items;
}
function showMentionDropdown(ta,items){
  const dd=document.getElementById('mentionDropdown');
  dd.innerHTML=items.map((it,i)=>`<div class="mention-item${i===0?' active':''}" data-name="${esc(it.name)}"><span class="mi-icon">${it.icon}</span>${esc(it.name)}</div>`).join('');
  const rect=ta.getBoundingClientRect();
  dd.style.top=(rect.bottom+window.scrollY+4)+'px';
  dd.style.left=(rect.left+window.scrollX)+'px';
  dd.classList.add('open');
  dd.querySelectorAll('.mention-item').forEach(el=>{
    el.addEventListener('click',()=>insertMention(el.dataset.name));
  });
}
function hideMentionDropdown(){ document.getElementById('mentionDropdown').classList.remove('open'); }
function insertMention(name){
  const ta=document.getElementById('imgPrompt')||document.getElementById('vidPrompt');
  if(!ta) return;
  const before=ta.value.substring(0,mentionState.start);
  const after=ta.value.substring(ta.selectionStart);
  ta.value=before+'@'+name+' '+after;
  hideMentionDropdown(); mentionState.active=false;
  updateRefTable();
  ta.focus();
}

/* ==================== Keyboard for Mentions ==================== */
document.addEventListener('keydown',e=>{
  if(!mentionState.active) return;
  const dd=document.getElementById('mentionDropdown');
  if(!dd.classList.contains('open')) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); mentionState.index=(mentionState.index+1)%mentionState.items.length; updateMentionActive(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); mentionState.index=(mentionState.index-1+mentionState.items.length)%mentionState.items.length; updateMentionActive(); }
  else if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); const it=mentionState.items[mentionState.index]; if(it) insertMention(it.name); }
  else if(e.key==='Escape'){ hideMentionDropdown(); mentionState.active=false; }
});
function updateMentionActive(){
  document.querySelectorAll('.mention-item').forEach((el,i)=>el.classList.toggle('active',i===mentionState.index));
}

/* ==================== Project Management ==================== */
function loadProjects(){
  try{
    const saved=JSON.parse(localStorage.getItem('ai_studio_projects')||'null');
    if(saved && Array.isArray(saved) && saved.length) projects=saved;
  }catch(e){ projects=[{id:'default',name:'默认项目'}]; }
  if(!projects.find(p=>p.id===currentProjectId)) currentProjectId=projects[0].id;
}
function saveProjects(){
  localStorage.setItem('ai_studio_projects',JSON.stringify(projects));
}
function renderProjectTabs(){
  const c=document.getElementById('projectTabs');
  c.innerHTML=projects.map(p=>`
    <div class="project-tab${p.id===currentProjectId?' active':''}" data-id="${p.id}">
      <span class="pt-name" onclick="selectProject('${p.id}')">${esc(p.name)}</span>
      <span class="pt-actions">
        <button onclick="renameProject('${p.id}')" title="重命名">✎</button>
        ${p.id!=='default'?`<button onclick="deleteProject('${p.id}')" title="删除">✕</button>`:''}
      </span>
    </div>`).join('') + '<div class="project-add" onclick="createProject()">+ 新建项目</div>';
}
function selectProject(id){
  currentProjectId=id;
  filters.page=1;
  filters.selected.clear();
  renderProjectTabs();
  renderTaskList();
  updateBatchPanel();
}
function createProject(){
  const name=prompt('请输入项目名称:');
  if(!name||!name.trim()) return;
  const p={id:'proj_'+Date.now(),name:name.trim()};
  projects.push(p);
  currentProjectId=p.id;
  saveProjects();
  renderProjectTabs();
  renderTaskList();
  showToast('项目已创建','success');
}
function renameProject(id){
  const p=projects.find(x=>x.id===id);
  if(!p) return;
  const name=prompt('请输入新名称:',p.name);
  if(!name||!name.trim()) return;
  p.name=name.trim();
  saveProjects();
  renderProjectTabs();
  showToast('项目已重命名','success');
}
function deleteProject(id){
  if(id==='default'){ showToast('默认项目不可删除','warn'); return; }
  if(!confirm('确定删除此项目? 关联的任务将一并删除.')) return;
  tasks=tasks.filter(t=>t.projectId!==id);
  drafts=drafts.filter(d=>d.projectId!==id);
  projects=projects.filter(p=>p.id!==id);
  if(currentProjectId===id) currentProjectId='default';
  saveProjects(); saveTasks(); saveDrafts();
  renderProjectTabs();
  renderTaskList();
  showToast('项目已删除','success');
}

}

/* ==================== Create Task Modal ==================== */
function openCreateModal(taskId){
  // Clear state
  uploadedImages=[];
  uploadedAudios=[];
  lockedSeed=null;
  lastSeed=null;
  editingTaskId=taskId||null;

  // Determine model: from task being edited, or first available
  let modelToSelect=null;
  if(taskId){
    const task=tasks.find(t=>t.id===taskId);
    if(task){
      modelToSelect=getAllModels().find(m=>m.modelId===task.specs?.modelId)||getAllModels().find(m=>m.id===task.specs?.modelId);
    }
  }
  if(!modelToSelect) modelToSelect=currentModel||getAllModels()[0];
  currentModel=modelToSelect;

  document.getElementById('createModalTitle').textContent=taskId?'编辑任务':'创建任务';
  renderCreateModalFields();
  document.getElementById('createModal').classList.add('open');

  // If editing, populate fields
  if(taskId){
    const task=tasks.find(t=>t.id===taskId);
    if(task) populateCreateModalFromTask(task);
  }
  // If editing a draft, populate from draft
  if(taskId){

function renderUploadArea(type,m){
  const imgArea=`
  <div class="field">
    <label>参考图片</label>

      <div class="upload-icon">🖼</div>

      <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)" />
    </div>
    <div class="upload-cards" id="imageCards"></div>
  </div>`;
  const audArea=(type==='video'&&m.supportsAudio)?`
  <div class="field" id="uploadAudioSection">
    <label>参考音频</label>
    <div class="upload-area" id="uploadAudioArea" onclick="document.getElementById('audioFileInput').click()">
      <div class="upload-icon">🎵</div>
      <div class="upload-hint">点击或拖拽上传音频 (MP3/WAV)</div>
      <input type="file" id="audioFileInput" accept="audio/*" multiple style="display:none" onchange="handleAudioUpload(event)" />
    </div>
    <div class="upload-cards" id="audioCards"></div>
  </div>`:'';
  return imgArea+audArea;
}
function bindUploadEvents(){
  const imgArea=document.getElementById('uploadImageArea');
  if(imgArea){
    imgArea.addEventListener('dragover',e=>{e.preventDefault();imgArea.classList.add('dragover');});
    imgArea.addEventListener('dragleave',()=>imgArea.classList.remove('dragover'));
    imgArea.addEventListener('drop',e=>{e.preventDefault();imgArea.classList.remove('dragover');handleImageFiles(e.dataTransfer.files);});
  }
  const audArea=document.getElementById('uploadAudioArea');
  if(audArea){
    audArea.addEventListener('dragover',e=>{e.preventDefault();audArea.classList.add('dragover');});
    audArea.addEventListener('dragleave',()=>audArea.classList.remove('dragover'));
    audArea.addEventListener('drop',e=>{e.preventDefault();audArea.classList.remove('dragover');handleAudioFiles(e.dataTransfer.files);});
  }
  renderImageCards(); renderAudioCards();
}
function handleImageUpload(e){ handleImageFiles(e.target.files); e.target.value=''; }
function handleAudioUpload(e){ handleAudioFiles(e.target.files); e.target.value=''; }
function handleImageFiles(files){
  [...files].forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      uploadedImages.push({dataUri:ev.target.result,label:file.name,name:file.name.replace(/\.[^.]+$/,'')});
      renderImageCards(); updateRefTable();
    };
    reader.readAsDataURL(file);
  });
}
function handleAudioFiles(files){
  [...files].forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      uploadedAudios.push({dataUri:ev.target.result,label:file.name,name:file.name.replace(/\.[^.]+$/,'')});
      renderAudioCards(); updateRefTable();
    };
    reader.readAsDataURL(file);
  });
}
function renderImageCards(){
  const c=document.getElementById('imageCards');
  if(!c) return;
  c.innerHTML=uploadedImages.map((img,i)=>{
    const imgIdx=uploadedImages.indexOf(img)+1;
    return `<div class="upload-card">
      <img src="${img.dataUri}" alt="${esc(img.name)}" />
      <input type="text" class="card-name" value="${esc(img.name)}" oninput="updateImageName(${i},this.value)" placeholder="名称" />
      <div class="card-mention">@${esc(img.name)} → &lt;Picture ${imgIdx}&gt;</div>
      <button class="btn-remove" onclick="removeImage(${i})">&times;</button>
    </div>`;
  }).join('');
}
function renderAudioCards(){
  const c=document.getElementById('audioCards');
  if(!c) return;
  c.innerHTML=uploadedAudios.map((aud,i)=>{
    const audIdx=uploadedAudios.indexOf(aud)+1;
    return `<div class="upload-card">
      <audio src="${aud.dataUri}" controls style="height:40px"></audio>
      <input type="text" class="card-name" value="${esc(aud.name)}" oninput="updateAudioName(${i},this.value)" placeholder="名称" />
      <div class="card-mention">@${esc(aud.name)} → &lt;Audio ${audIdx}&gt;</div>
      <button class="btn-remove" onclick="removeAudio(${i})">&times;</button>
    </div>`;
  }).join('');
}
function updateImageName(i,name){ uploadedImages[i].name=name; renderImageCards(); updateRefTable(); }
function updateAudioName(i,name){ uploadedAudios[i].name=name; renderAudioCards(); updateRefTable(); }
function removeImage(i){ uploadedImages.splice(i,1); renderImageCards(); updateRefTable(); }
function removeAudio(i){ uploadedAudios.splice(i,1); renderAudioCards(); updateRefTable(); }

/* ==================== Seed Lock ==================== */
function toggleSeedLock(){
  const btn=document.getElementById('seedLock');
  const input=document.getElementById('seedInput');
  if(lockedSeed!==null){
    lockedSeed=null; btn.textContent='🔓'; btn.classList.remove('locked');
    input.disabled=false;
  } else {
    const s=input.value.trim();
    lockedSeed=s||Math.floor(Math.random()*1000000);
    if(!s) input.value=lockedSeed;
    btn.textContent='🔒'; btn.classList.add('locked');
    input.disabled=true;
  }
}

/* ==================== Submit Task ==================== */
function submitTask(){
  if(!currentModel){ showToast('请先选择模型','error'); return; }
  const key=getApiKey();
  if(!key){ showToast('请先输入 API Key','error'); return; }
  const isImage=currentModel.type==='image';
  const prompt=processPrompt(val(isImage?'imgPrompt':'vidPrompt'));
  if(!prompt){ showToast('请输入 Prompt','error'); return; }
  if(isGenerating){ showToast('当前有任务正在生成，请稍候','warn'); return; }

  // Build specs
  let specs={ modelId:currentModel.modelId, modelName:currentModel.name, type:currentModel.type };
  let seed=getSeedValue();
  if(isImage){
    specs.size=val('imgSize');
    specs.ratio=val('imgRatio');
    specs.negPrompt=getNegPrompt('imgNegPrompt');
  } else {
    specs.mode=document.querySelector('.mode-tab.active')?.dataset.mode||'text';
    specs.duration=val('vidSeconds');
    specs.size=val('vidSize');
    specs.ratio=val('vidRatio');
    specs.negPrompt=getNegPrompt('vidNegPrompt');
    specs.supportsAudio=currentModel.supportsAudio;
  }
  if(seed) specs.seed=seed;

  // Create task
  const task={
    id:'task_'+Date.now(),
    type:currentModel.type,
    status:'generating',
    src:null,
    prompt:prompt,
    time:new Date().toISOString(),
    seed:seed||null,
    model:currentModel.name,
    specs:specs,
    projectId:currentProjectId,
    progress:0,
    error:null,
    params:{
      model:currentModel.modelId,
      prompt:prompt,
      size:specs.size,
      aspect_ratio:specs.ratio,
      images:uploadedImages.map(i=>i.dataUri),
      negative_prompt:specs.negPrompt||'',
      seed:seed||null
    }
  };
  if(!isImage){
    task.params.seconds=specs.duration;
    task.params.mode=specs.mode;
    task.params.audios=(specs.mode!=='text'&&currentModel.supportsAudio)?uploadedAudios.map(a=>a.dataUri):[];
  }

  // If editing, remove old task
  if(editingTaskId){
    const idx=tasks.findIndex(t=>t.id===editingTaskId);
    if(idx>-1) tasks.splice(idx,1);
    editingTaskId=null;
  }

  tasks.unshift(task);
  saveTasks();
  closeCreateModal();
  // Switch to task list view
  currentView='tasks';
  document.getElementById('viewTabTasks').classList.add('active');
  document.getElementById('viewTabDrafts').classList.remove('active');
  renderTaskList();

  // Start generation
  currentTask=task;
  if(isImage){
    generateImage();
  } else {
    generateVideo();
  }
}

/* ==================== Image Generation ==================== */
async function generateImage(){
  if(!currentModel||!currentTask){ showToast('生成错误: 无当前任务','error'); return; }
  const key=getApiKey();
  if(!key){ showToast('请先输入 API Key','error'); currentTask.status='failed'; currentTask.error='未设置API Key'; saveTasks(); renderTaskList(); return; }
  const prompt=currentTask.prompt;
  if(!prompt){ showToast('请输入 Prompt','error'); currentTask.status='failed'; currentTask.error='Prompt为空'; saveTasks(); renderTaskList(); return; }
  setGenerating(true);
  try{
    currentTask.progress=5; currentTask.statusText='提交中...'; renderTaskList();
    const body={ model:currentModel.modelId, prompt, size:currentTask.params.size, aspect_ratio:currentTask.params.aspect_ratio };
    const imgs=currentTask.params.images||[];
    if(imgs.length) body.images=imgs;
    const neg=currentTask.params.negative_prompt;
    if(neg) body.negative_prompt=neg;
    const seed=currentTask.params.seed;
    if(seed) body.seed=seed;
    currentTask.progress=15; currentTask.statusText='请求生成中...'; renderTaskList();
    let resp=await fetch('/api/images/generations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const respText=await resp.text();
    let data; try{ data=JSON.parse(respText); }catch(e){ throw new Error(respText||`HTTP ${resp.status}`); }
    if(!resp.ok){ const errMsg=data?.error?.message||data?.detail||data?.message||respText||`HTTP ${resp.status}`; throw new Error(errMsg); }
    // Extract URL from response
    let imgUrl=data.data?.[0]?.url||data.image_url||data.url||data.data?.image_url||data.data?.url||data.output?.[0]||data.images?.[0];
    if(imgUrl){
      currentTask.progress=90; currentTask.statusText='下载保存中...'; renderTaskList();
      await completeTaskWithMedia(currentTask,imgUrl);
      return;
    }
    // Poll if task_id present
    if(data.task_id||data.id||data.request_id){
      currentTask.backendTaskId=data.task_id||data.id||data.request_id;
      currentTask.progress=20; currentTask.statusText='排队中...'; saveTasks(); renderTaskList();
      let pollCount=0;
      while(true){
        pollCount++;
        if(pollCount>120) throw new Error('生成超时');
        currentTask.progress=Math.max(20,Math.min(90,20+pollCount/120*70));
        renderTaskList();
        await new Promise(r=>setTimeout(r,3000));
        const pid=data.task_id||data.id||data.request_id;
        const pollResp=await fetch(`/api/tasks/${pid}`,{headers:{'Authorization':'Bearer '+key}});
        const pollText=await pollResp.text();
        try{ data=JSON.parse(pollText); }catch(e){ continue; }
        if(data.status==='completed'||data.status==='succeeded'||data.state==='SUCCESS'){
          imgUrl=data.data?.[0]?.url||data.image_url||data.url||data.data?.image_url||data.data?.url||data.metadata?.url||data.output?.[0];
          if(imgUrl){
            currentTask.progress=90; currentTask.statusText='下载保存中...'; renderTaskList();
            await completeTaskWithMedia(currentTask,imgUrl); return;
          }
        }
        if(data.state==='FAILED'||data.status==='failed') throw new Error(data.error?.message||data.error||'生成失败');
        const apiProg=data.progress||data.percent;
        if(apiProg&&typeof apiProg==='number'&&apiProg>0){ currentTask.progress=Math.max(currentTask.progress,Math.min(90,apiProg)); currentTask.statusText=data.status||'生成中...'; }
        else { currentTask.statusText=data.status||'生成中...'; }
      }
    }
    throw new Error('未获取到图片结果');
  }catch(e){
    showToast('生成失败: '+e.message,'error');
    if(currentTask){
      currentTask.status='failed';
      currentTask.error=e.message;
      saveTasks();
      renderTaskList();
    }
  }
  finally{ setGenerating(false); currentTask=null; }
}

/* Helper: download media to local and complete task */
async function completeTaskWithMedia(task,srcUrl){
  let localSrc=srcUrl;
  if(srcUrl&&!srcUrl.startsWith('/media/')&&!srcUrl.startsWith('/tmp/')&&!srcUrl.startsWith('blob:')){
    try{
      const resp=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:srcUrl,type:task.type})});
      const data=await resp.json();
      if(data.success&&data.url) localSrc=data.url;
    }catch(e){ console.error('Download failed:',e); }
  }
  task.status='completed';
  task.src=localSrc;
  task.progress=100;
  lastSeed=task.seed;
  saveTasks();
  renderTaskList();
}

/* Helper: download media via backend proxy (avoids CORS) */
async function downloadMedia(url, filename){
  try{
    if(url.startsWith('/media/') || url.startsWith('/tmp/')){
      const a=document.createElement('a');
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return;
    }
    const resp=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,filename})});
    const data=await resp.json();
    if(data.success && data.url){
      const a=document.createElement('a');
      a.href=data.url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }else{
      throw new Error(data.error?.message||'下载失败');
    }
  }catch(e){
    showToast('下载失败: '+e.message,'error');
  }
}

/* ==================== Video Generation ==================== */
async function generateVideo(){
  if(!currentModel||!currentTask){ showToast('生成错误: 无当前任务','error'); return; }
  const key=getApiKey();
  if(!key){ showToast('请先输入 API Key','error'); currentTask.status='failed'; currentTask.error='未设置API Key'; saveTasks(); renderTaskList(); return; }
  const prompt=currentTask.prompt;
  if(!prompt){ showToast('请输入 Prompt','error'); currentTask.status='failed'; currentTask.error='Prompt为空'; saveTasks(); renderTaskList(); return; }
  const mode=currentTask.params.mode||'text';
  setGenerating(true);
  try{
    currentTask.progress=5; currentTask.statusText='提交中...'; renderTaskList();
    const body={ model:currentModel.modelId, prompt, seconds:String(currentTask.params.seconds), mode, size:currentTask.params.size, aspect_ratio:currentTask.params.aspect_ratio };
    if(mode==='reference'||mode==='keyframe'){
      const imgs=currentTask.params.images||[];
      if(imgs.length) body.images=imgs;
      const auds=currentTask.params.audios||[];
      if(auds.length&&currentModel.supportsAudio) body.audios=auds;
    }
    const neg=currentTask.params.negative_prompt;
    if(neg) body.negative_prompt=neg;
    const seed=currentTask.params.seed;
    if(seed) body.seed=seed;
    currentTask.progress=15; currentTask.statusText='请求生成中...'; renderTaskList();
    let resp=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const respText=await resp.text();
    let data; try{ data=JSON.parse(respText); }catch(e){ throw new Error(respText||`HTTP ${resp.status}`); }
    if(!resp.ok){ const errMsg=data?.error?.message||data?.detail||data?.message||respText||`HTTP ${resp.status}`; throw new Error(errMsg); }
    const videoId=data.task_id||data.id||data.request_id||data.video_id;
    if(videoId){
      currentTask.backendTaskId=videoId;
      currentTask.progress=20; currentTask.statusText='排队中...'; saveTasks(); renderTaskList();
      const url=await pollVideoTask(videoId,key,(p,status)=>{
        currentTask.progress=Math.round(p);
        currentTask.statusText=status||'生成中...';
        renderTaskList();
      });
      currentTask.progress=90; currentTask.statusText='下载保存中...'; renderTaskList();
      await completeTaskWithMedia(currentTask,url);
    } else {
      const url=data.metadata?.url||data.video_url||data.url||data.data?.video_url;
      if(url){
        currentTask.progress=90; currentTask.statusText='下载保存中...'; renderTaskList();
        await completeTaskWithMedia(currentTask,url);
      }
      else throw new Error('未获取到视频结果');
    }
  }catch(e){
    showToast('生成失败: '+e.message,'error');
    if(currentTask){
      currentTask.status='failed';
      currentTask.error=e.message;
      saveTasks();
      renderTaskList();
    }
  }
  finally{ setGenerating(false); currentTask=null; }
}

/* ==================== Poll Video Task ==================== */
async function pollVideoTask(videoId,apiKey,onProgress){
  const maxRetries=200; // 200 * 3s = 10 minutes
  let lastProgress=0;
  let notFoundCount=0;
  for(let i=0;i<maxRetries;i++){
    await new Promise(r=>setTimeout(r,3000));
    const resp=await fetch(`/api/tasks/${videoId}`,{headers:{'Authorization':'Bearer '+apiKey}});
    const text=await resp.text();
    let data; try{ data=JSON.parse(text); }catch(e){
      if(i>5) console.warn('Poll parse error, attempt',i,text.substring(0,200));
      continue;
    }
    if(!resp.ok){
      if(resp.status===404){
        notFoundCount++;
        if(notFoundCount>10) throw new Error('任务不存在或已过期（连续10次404）');
        if(onProgress){ onProgress(Math.max(lastProgress,5), '等待任务创建...'); }
        continue;
      }
      if(i>3) console.warn('Poll HTTP',resp.status);
      continue;
    }
    // Check various status formats the API might return
    const status=data.status||data.state||'';
    const statusLower=String(status).toLowerCase();
    if(statusLower==='completed'||statusLower==='succeeded'||statusLower==='success'||status==='SUCCESS'){
      const url=data.metadata?.url||data.video_url||data.url||data.data?.video_url||data.data?.url||data.output?.url||data.result?.url;
      if(url) return url;
      throw new Error('视频已完成但未获取到URL: '+JSON.stringify(data).substring(0,300));
    }
    if(statusLower==='failed'||status==='FAILED'){
      throw new Error(data.error?.message||data.error||data.message||'生成失败');
    }
    const apiProgress=data.progress??data.percent??0;
    if(apiProgress&&typeof apiProgress==='number'&&apiProgress>0){ lastProgress=Math.max(lastProgress,apiProgress); }
    if(onProgress){
      const displayProgress=Math.max(lastProgress,Math.min(90,20+(i/maxRetries)*70));
      onProgress(displayProgress, status||'生成中...');
    }
  }
  throw new Error('生成超时（已等待10分钟）');
}

/* ==================== Task List Rendering ==================== */
function renderTaskList(){
  const container=document.getElementById('taskListContainer');

  // Get items based on current view
  let items;
  if(currentView==='drafts'){
    items=drafts.filter(d=>d.projectId===currentProjectId);
  } else {
    items=tasks.filter(t=>t.projectId===currentProjectId);
  }

  // Apply status filter (only for tasks view)
  if(currentView==='tasks' && filters.status!=='all'){
    items=items.filter(t=>t.status===filters.status);
  }

  // Apply sort
  if(filters.sort==='desc'){
    items.sort((a,b)=>new Date(b.time)-new Date(a.time));
  } else {
    items.sort((a,b)=>new Date(a.time)-new Date(b.time));
  }

  // Pagination
  const total=items.length;
  const totalPages=Math.max(1,Math.ceil(total/filters.perPage));
  if(filters.page>totalPages) filters.page=totalPages;
  const start=(filters.page-1)*filters.perPage;
  const pageItems=items.slice(start,start+filters.perPage);

  // Update task count badge
  const badge=document.getElementById('taskCountBadge');
  const projectTasks=tasks.filter(t=>t.projectId===currentProjectId);
  badge.textContent=`任务列表(${projectTasks.length})`;

  // Update stats
  updateStats();

  // Render
  if(!pageItems.length){
    container.innerHTML=`<div class="task-empty"><div class="empty-icon">${currentView==='drafts'?'📝':'📋'}</div><p>${currentView==='drafts'?'暂无暂存任务':'暂无任务，点击"创建任务"开始'}</p></div>`;
    document.getElementById('pagination').style.display='none';
    return;
  }

  container.innerHTML=pageItems.map(t=>currentView==='drafts'?renderDraftCard(t):renderTaskCard(t)).join('');
  document.getElementById('pagination').style.display=totalPages>1?'flex':'none';
  renderPagination(totalPages);
}

/* ==================== Task Actions ==================== */
function resubmitTask(id){
  const task=tasks.find(t=>t.id===id);
  if(!task) return;
  if(isGenerating){ showToast('当前有任务正在生成，请稍候','warn'); return; }
  // Create a new task with same params
  const newTask={
    ...JSON.parse(JSON.stringify(task)),
    id:'task_'+Date.now(),
    status:'generating',
    src:null,
    time:new Date().toISOString(),
    progress:0,
    error:null,
    _expanded:false
  };
  tasks.unshift(newTask);
  saveTasks();
  renderTaskList();
  currentTask=newTask;
  // Find the model
  currentModel=getAllModels().find(m=>m.modelId===task.specs?.modelId)||getAllModels().find(m=>m.id===task.specs?.modelId)||currentModel;
  if(task.type==='image'){
    generateImage();
  } else {
    generateVideo();
  }
}

    id:'task_'+Date.now(),

    src:null,
    prompt:draft.prompt,
    time:new Date().toISOString(),
    seed:draft.seed||null,
    model:draft.specs?.modelName||currentModel.name,
    specs:{...draft.specs},
    projectId:currentProjectId,
    progress:0,
    error:null,
    params:{
      model:currentModel.modelId,
      prompt:draft.prompt,
      size:draft.specs?.size,

/* ==================== Task Persistence ==================== */
function migrateHistoryToTasks(){
  try{
    const oldHistory=JSON.parse(localStorage.getItem('ai_studio_history')||'[]');
    if(oldHistory.length && !tasks.length){
      tasks=oldHistory.map((h,i)=>{
        const dt=h.time?new Date(h.time):new Date();
        if(isNaN(dt)) h.time=new Date().toISOString();
        else { try{ h.time=new Date(h.time).toISOString(); }catch(e){ h.time=new Date().toISOString(); } }
        return {
          id:'migrated_'+i+'_'+Date.now(),
          type:h.type||'image',
          status:'completed',
          src:h.src,
          prompt:h.prompt||'',
          time:h.time,
          seed:h.seed||null,
          model:'Unknown',
          specs:{},
          projectId:'default',
          progress:100,
          error:null
        };
      });
      localStorage.removeItem('ai_studio_history');
      saveTasks();
      return true;
    }
  }catch(e){ console.warn('Migration failed:',e); }
  return false;
}
function loadTasks(){
  try{ tasks=JSON.parse(localStorage.getItem('ai_studio_tasks')||'[]'); }catch(e){ tasks=[]; }
  // Migrate old history
  if(!tasks.length) migrateHistoryToTasks();
  // Fetch from backend
  fetch('/api/history').then(r=>r.json()).then(data=>{
    if(data.success&&data.history&&data.history.length>0){
      // Backend stores tasks format (or old history format)
      const backendTasks=data.history.map(h=>{
        if(h.id&&h.status) return h; // already task format
        // Old history format - convert
        return {
          id:h.id||('backend_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)),
          type:h.type||'image',
          status:'completed',
          src:h.src,
          prompt:h.prompt||'',
          time:h.time||new Date().toISOString(),
          seed:h.seed||null,
          model:h.model||'Unknown',
          specs:h.specs||{},
          projectId:h.projectId||'default',
          progress:100,
          error:null
        };
      });
      const backendIds=backendTasks.map(t=>t.id);
      const localOnly=tasks.filter(t=>!backendIds.includes(t.id));
      const merged=[...tasks,...backendTasks.filter(bt=>!tasks.some(t=>t.id===bt.id))];
      // Deduplicate by id, keeping local (newer) versions
      const seen=new Map();
      merged.forEach(t=>{ seen.set(t.id,t); });
      tasks=[...seen.values()].sort((a,b)=>new Date(b.time)-new Date(a.time));
      renderTaskList();
    }
  }).catch(()=>{});
}
function saveTasks(){
  // Strip non-serializable fields before saving
  const toSave=tasks.map(t=>{
    const copy={...t};
    delete copy._expanded;
    // Don't save large data URIs in params.images/params.audios to localStorage
    if(copy.params){
      const p={...copy.params};
      if(p.images) p.images=p.images.map(()=>null); // placeholder
      if(p.audios) p.audios=p.audios.map(()=>null);
      copy.params=p;
    }
    return copy;
  });
  localStorage.setItem('ai_studio_tasks',JSON.stringify(toSave));
  // Save to backend
  fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:toSave})}).catch(()=>{});
}

/* ==================== Custom Models ==================== */
function loadCustomModels(){
  try{ customModels=JSON.parse(localStorage.getItem('custom_models')||'[]'); }catch(e){ customModels=[]; }
}
function saveCustomModels(){
  localStorage.setItem('custom_models',JSON.stringify(customModels));
}
function openModelModal(){
  document.getElementById('modalTitle').textContent='自定义模型';
  document.getElementById('cmId').value='';
  document.getElementById('cmName').value='';
  document.getElementById('cmModelId').value='';
  document.getElementById('cmType').value='image';
  document.getElementById('cmTag').value='free';
  document.getElementById('cmIcon').value='🤖';
  document.getElementById('cmApiBase').value='';
  document.getElementById('cmSizes').value='1K,2K,4K';
  document.getElementById('cmRatios').value='1:1,16:9,9:16,4:3,3:4';
  document.getElementById('cmMaxImages').value=5;
  document.getElementById('cmDurations').value='4,5,6,7,8,9,10,11,12';
  document.getElementById('cmVSizes').value='720P,960P,2K';
  document.getElementById('cmVRatios').value='16:9,9:16,4:3,1:1';
  document.getElementById('cmAudio').checked=true;
  document.getElementById('cmVideoRef').checked=false;
  document.querySelectorAll('.cmMode').forEach(cb=>cb.checked=true);
  toggleCmFields();
  renderCustomModelList();
  document.getElementById('modelModal').classList.add('open');
}
function closeModelModal(){ document.getElementById('modelModal').classList.remove('open'); }
function toggleCmFields(){
  const type=document.getElementById('cmType').value;
  document.getElementById('cmImageFields').style.display=type==='image'?'':'none';
  document.getElementById('cmVideoFields').style.display=type==='video'?'':'none';
}
function saveCustomModel(){
  const id=document.getElementById('cmId').value;
  const name=document.getElementById('cmName').value.trim();
  const modelId=document.getElementById('cmModelId').value.trim();
  if(!name||!modelId){ showToast('请填写名称和模型ID','error'); return; }
  const type=document.getElementById('cmType').value;
  const model={
    id:id||('custom-'+Date.now()),
    name, modelId, type,
    tag:document.getElementById('cmTag').value,
    icon:document.getElementById('cmIcon').value.trim()||'🤖',
    desc:type==='image'?'自定义图片模型':'自定义视频模型'
  };
  const apiBase=document.getElementById('cmApiBase').value.trim();
  if(apiBase) model.apiBase=apiBase;
  if(type==='image'){
    model.sizes=document.getElementById('cmSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    model.ratios=document.getElementById('cmRatios').value.split(',').map(s=>s.trim()).filter(Boolean);
  } else {
    model.modes=[...document.querySelectorAll('.cmMode:checked')].map(cb=>cb.value);
    model.maxImages=parseInt(document.getElementById('cmMaxImages').value)||5;
    model.durations=document.getElementById('cmDurations').value.split(',').map(s=>parseInt(s.trim())).filter(Boolean);
    model.sizes=document.getElementById('cmVSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    model.ratios=document.getElementById('cmVRatios').value.split(',').map(s=>s.trim()).filter(Boolean);
    model.supportsAudio=document.getElementById('cmAudio').checked;
    model.supportsVideoRef=document.getElementById('cmVideoRef').checked;
  }
  const idx=customModels.findIndex(m=>m.id===model.id);
  if(idx>-1) customModels[idx]=model; else customModels.push(model);
  saveCustomModels();
  if(currentModel&&currentModel.id===model.id) currentModel=model;
  renderCustomModelList();
  showToast('模型已保存','success');
  closeModelModal();
}
function editCustomModel(id){
  const m=customModels.find(cm=>cm.id===id);
  if(!m) return;
  document.getElementById('modalTitle').textContent='编辑模型';
  document.getElementById('cmId').value=m.id;
  document.getElementById('cmName').value=m.name;
  document.getElementById('cmModelId').value=m.modelId;
  document.getElementById('cmType').value=m.type;
  document.getElementById('cmTag').value=m.tag||'free';
  document.getElementById('cmIcon').value=m.icon||'🤖';
  document.getElementById('cmApiBase').value=m.apiBase||'';
  if(m.type==='image'){
    document.getElementById('cmSizes').value=(m.sizes||[]).join(',');
    document.getElementById('cmRatios').value=(m.ratios||[]).join(',');
  } else {
    document.getElementById('cmMaxImages').value=m.maxImages||5;
    document.getElementById('cmDurations').value=(m.durations||[]).join(',');
    document.getElementById('cmVSizes').value=(m.sizes||[]).join(',');
    document.getElementById('cmVRatios').value=(m.ratios||[]).join(',');
    document.getElementById('cmAudio').checked=!!m.supportsAudio;
    document.getElementById('cmVideoRef').checked=!!m.supportsVideoRef;
    document.querySelectorAll('.cmMode').forEach(cb=>cb.checked=(m.modes||[]).includes(cb.value));
  }
  toggleCmFields();
  renderCustomModelList();
  document.getElementById('modelModal').classList.add('open');
}
function deleteCustomModel(id){
  if(!confirm('确定删除此模型?')) return;
  customModels=customModels.filter(m=>m.id!==id);
  saveCustomModels();
  if(currentModel&&currentModel.id===id){ currentModel=getAllModels()[0]; }
  renderCustomModelList();
  showToast('模型已删除','success');
}
function renderCustomModelList(){
  const c=document.getElementById('customModelList');
  if(!customModels.length){ c.innerHTML='<p style="color:var(--muted);font-size:12px">暂无自定义模型</p>'; return; }
  c.innerHTML=customModels.map(m=>`
    <div class="modal-list-item">
      <span>${esc(m.icon)} ${esc(m.name)} <span style="color:var(--muted)">(${esc(m.modelId)})</span></span>
      <span>
        <button class="btn btn-sm" onclick="editCustomModel('${m.id}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteCustomModel('${m.id}')">删除</button>
      </span>
    </div>`).join('');
}

/* ==================== Auto Update ==================== */
function isElectron(){
  return typeof window.electronAPI!=='undefined' && window.electronAPI.isElectron();
}

async function initUpdater(){
  if(!isElectron()){
    const badge=document.getElementById('versionBadge');
    if(badge){ badge.textContent='Web版'; badge.style.cursor='default'; }
    return;
  }
  try{
    const ver=await window.electronAPI.getAppVersion();
    const badge=document.getElementById('versionBadge');
    if(badge) badge.textContent='v'+ver;

    window.electronAPI.onUpdateAvailable((info)=>{
      showUpdateBanner(info.version, info.releaseNotes);
    });
    window.electronAPI.onDownloadProgress((progress)=>{
      const right=document.getElementById('updateBannerRight');
      if(right){
        right.innerHTML='<div style="text-align:center"><div>下载中 '+progress.percent+'%</div><div class="update-progress-bar"><div class="update-progress-fill" style="width:'+progress.percent+'%"></div></div></div>';
      }
    });
    window.electronAPI.onUpdateDownloaded((info)=>{
      const right=document.getElementById('updateBannerRight');
      const text=document.getElementById('updateBannerText');
      if(text) text.textContent='更新已下载完成，立即安装？';
      if(right){
        right.innerHTML='<button class="btn" onclick="installUpdate()">立即安装并重启</button><button class="btn" onclick="closeUpdateBanner()">稍后</button>';
      }
    });
    window.electronAPI.onUpdateError((error)=>{
      showToast('更新出错: '+error.message,'error');
      closeUpdateBanner();
    });
  }catch(e){ console.warn('Updater init failed:',e); }
}

function showUpdateBanner(version, notes){
  const banner=document.getElementById('updateBanner');
  const text=document.getElementById('updateBannerText');
  const right=document.getElementById('updateBannerRight');
  if(text) text.textContent='发现新版本 v'+version+(notes?'：'+notes:'');
  if(right){
    right.innerHTML='<button class="btn" onclick="downloadUpdate()">立即更新</button><button class="btn" onclick="closeUpdateBanner()">稍后</button>';
  }
  if(banner) banner.classList.add('open');
}

function closeUpdateBanner(){
  const banner=document.getElementById('updateBanner');
  if(banner) banner.classList.remove('open');
}

async function checkForUpdates(){
  if(!isElectron()){ showToast('Web版不支持自动更新，请刷新页面获取最新版本','warn'); return; }
  showToast('正在检查更新...','');
  try{
    const result=await window.electronAPI.checkForUpdates();
    if(result.success && result.hasUpdate){
      showUpdateBanner(result.version,'');
    } else if(result.success){
      showToast('已是最新版本','success');
    } else {
      showToast('检查更新失败: '+result.error,'error');
    }
  }catch(e){
    showToast('检查更新失败: '+e.message,'error');
  }
}

async function downloadUpdate(){
  if(!isElectron()) return;
  const right=document.getElementById('updateBannerRight');
  if(right){
    right.innerHTML='<div style="text-align:center"><div>下载中 0%</div><div class="update-progress-bar"><div class="update-progress-fill" style="width:0"></div></div></div>';
  }
  try{
    const result=await window.electronAPI.downloadUpdate();
    if(!result.success){
      showToast('下载更新失败: '+result.error,'error');
      closeUpdateBanner();
    }
  }catch(e){
    showToast('下载更新失败: '+e.message,'error');
    closeUpdateBanner();
  }
}

async function installUpdate(){
  if(!isElectron()) return;
  await window.electronAPI.installUpdate();
}

/* ==================== Init ==================== */
window.addEventListener('load',async ()=>{
  if(window.electronAPI && window.electronAPI.getApiKey){
    try{ cachedApiKey=await window.electronAPI.getApiKey()||''; }catch(e){ cachedApiKey=''; }
  }
  const saved=getApiKey();
  if(saved) document.getElementById('apiKey').value=saved;
  loadCustomModels();
  loadProjects();
  loadDrafts();
  currentModel=getAllModels()[0];
  loadTasks();
  renderProjectTabs();
  renderTaskList();
  initUpdater();
});

// Close modals on overlay click
document.addEventListener('click',e=>{
  if(e.target.classList.contains('modal-overlay')){
    e.target.classList.remove('open');
  }
});
